<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чужое мнение: Максимум</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg: #050505; --text: #e0e0e0; --purple: #9b59b6; --red: #e74c3c; --green: #2ecc71; --yellow: #f1c40f; }
        
        body {
            background-color: var(--bg); color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh; display: flex; flex-direction: column;
            overflow-x: hidden; transition: background-color 1s ease;
        }

        .ui-top {
            position: sticky; top: 0; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10; border-bottom: 1px solid #222;
            background: rgba(5, 5, 5, 0.95); backdrop-filter: blur(10px);
        }

        .ego-label { text-transform: uppercase; font-size: 0.8rem; color: #888; letter-spacing: 2px;}
        .ego-bar-container { width: 250px; height: 8px; border: 1px solid #444; background: #000; }
        .ego-bar {
            height: 100%; width: 100%; background-color: var(--green);
            transition: width 0.5s ease, background-color 0.5s ease;
            box-shadow: 0 0 10px var(--green);
        }

        .game-container {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; padding: 40px 20px;
            width: 100%; max-width: 1000px; margin: 0 auto; z-index: 2;
        }

        .situation-box {
            width: 100%; font-size: 1.05rem; line-height: 1.6; color: #fff;
            text-align: left; padding: 30px; border-left: 3px solid var(--purple);
            background: rgba(15, 15, 15, 0.9); box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            margin-bottom: 40px; position: relative; border-radius: 4px;
        }

        .situation-box::before {
            content: "> СИТУАЦИЯ"; position: absolute;
            top: -10px; left: 20px; background: var(--bg);
            padding: 0 10px; font-size: 0.7rem; color: var(--purple); letter-spacing: 1px;
        }

        .npc-text { font-style: italic; color: #ddd; margin-bottom: 20px; font-size: 1.1rem; }
        .inner-monologue {
            color: #888; font-size: 0.9rem; display: block;
            border-top: 1px dashed #333; padding-top: 15px;
        }

        .cards-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px; width: 100%;
        }

        .card {
            background: rgba(20, 20, 20, 0.9); border: 1px solid #333;
            padding: 25px; cursor: pointer; transition: all 0.3s ease;
            position: relative; display: flex; flex-direction: column;
            border-bottom: 3px solid transparent; border-radius: 4px;
        }

        .card:hover {
            border-color: #555; border-bottom-color: var(--purple);
            background: rgba(30, 30, 30, 0.95); transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
        }

        .card-title { font-weight: bold; color: #fff; margin-bottom: 15px; font-size: 1rem; }
        .card-desc { font-size: 0.85rem; color: #aaa; line-height: 1.5; }

        .shadow-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); z-index: 100;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 1s ease; padding: 20px;
        }

        .shadow-overlay.active { opacity: 1; pointer-events: all; }
        .shadow-test {
            background: #000; border: 2px solid var(--red);
            padding: 40px; max-width: 650px; width: 100%; text-align: center; display: none;
        }
        
        .shadow-overlay.active .shadow-test { display: block; }
        .shadow-test h2 { color: var(--red); margin-bottom: 20px; }
        .test-options { display: flex; flex-direction: column; gap: 15px; margin-top: 20px;}
        
        .test-btn {
            background: transparent; border: 1px solid #444; color: #aaa;
            padding: 15px; cursor: pointer; text-align: left;
            transition: 0.2s; font-family: inherit; font-size: 0.95rem;
        }
        .test-btn:hover { background: #111; color: #fff; border-color: var(--purple); }
        .test-btn.correct { border-color: var(--green); color: var(--green); }
        .test-btn.wrong { border-color: var(--red); color: var(--red); }

        .damage-flash { animation: flash-red 0.5s ease; }
        @keyframes flash-red { 0% { background-color: rgba(231, 76, 60, 0.2); } 100% { background-color: transparent; } }

        .game-over {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 5, 0.98);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 200; opacity: 0; pointer-events: none; transition: opacity 1s ease;
            text-align: center; padding: 20px;
        }
        .game-over.active { opacity: 1; pointer-events: all; }
        .game-over h1 { font-size: 2.5rem; margin-bottom: 20px; text-transform: uppercase; }
        .game-over p { color: #888; max-width: 700px; line-height: 1.6; margin-bottom: 30px; font-size: 1.1rem;}
        
        .reset-btn {
            background: transparent; border: 1px solid var(--text); color: var(--text);
            padding: 15px 40px; font-size: 1rem; cursor: pointer; font-family: inherit;
            transition: 0.3s; text-transform: uppercase;
        }
        .reset-btn:hover { background: var(--text); color: var(--bg); }
    </style>
</head>
<body>

    <div class="shadow-overlay" id="shadow-overlay">
        <div class="shadow-test" id="shadow-test">
            <h2>Потеря реальности</h2>
            <p id="test-question">Чужие слова стали твоими. Найди свою истину:</p>
            <div class="test-options" id="test-options"></div>
        </div>
    </div>

    <div class="ui-top">
        <div class="ego-label">Целостность Я</div>
        <div class="ego-bar-container">
            <div class="ego-bar" id="ego-bar"></div>
        </div>
    </div>

    <div class="game-container">
        <div class="situation-box">
            <div class="npc-text" id="npc-text">Загрузка...</div>
            <span class="inner-monologue" id="inner-monologue"></span>
        </div>
        <div class="cards-container" id="cards-container"></div>
    </div>

    <div class="game-over" id="game-over">
        <h1 id="final-title">...</h1>
        <p id="final-desc">...</p>
        <button class="reset-btn" onclick="resetGame()">Прожить ещё раз</button>
    </div>

    <script>
        const db = [
{ text: "«Подруга» копирует твой стиль, купила такую же куртку. А за спиной называет тебя «выпендрежкой» и смеется над твоими интересами.", inner: "Это психологический паразитизм. У них нет своего «Я». Они видят, что твой образ работает, и присваивают твою форму, чтобы почувствовать себя значимыми. Без тебя они — пустое место.", cards: [ { title: "Промолчать и стерпеть", desc: "Не хочу конфликта. Пусть копирует, мне не жалко.", effect: -15, log: "Ты проглотила это. Она почувствовала безнаказанность и продолжит паразитировать, забирая твой ресурс. Твоя граница не была обозначена." }, { title: "Установить границу", desc: "«Мне неприятно, что ты копируешь мой стиль. Это мое личное пространство».", effect: 15, log: "Ты отделила себя от нее. Она смутилась и обиделась, но ты четко обозначила свою территорию. Теперь она знает, где предел." }, { title: "Спросить прямо", desc: "«Зачем ты это делаешь? Тебе не хватает своей идентичности?»", effect: 20, log: "Ты вскрыла ее истинный мотив. Она впала в панику, потому что поняла, что ее «маска» спала. Ты показала, что видишь ее насквозь." }, { title: "Скопировать её в ответ", desc: "Ага, ну тогда я тоже начну делать так же, как она.", effect: -10, log: "Ты включилась в игру «животного уровня». Ты теряешь свою уникальность, пытаясь победить в чужой игре. Это не твой путь." }, { title: "Игнорировать", desc: "Полностью прекратить общение без объяснений.", effect: 5, log: "Ты сохранила свой ресурс, но не проговорила границу. Внутри остался небольшой осадок, но ты защитила себя от токсичного человека." } ] },
            { text: "Соседка по комнате заходит и, криво улыбаясь, говорит: «Ого, ты опять нарядилась? Куда-то собралась? Тебе не идет, выглядишь странно. Будь проще».", inner: "Она не говорит это прямо в лицо. Она делает это при других, чтобы унизить тебя, но оставить себе путь к отступлению («Да я же шучу»). Это пассивная агрессия и трусость.", cards: [ { title: "Начать оправдываться", desc: "Да я просто... ну, мне захотелось. А что, плохо?", effect: -20, log: "Ты съежилась и начала искать оправдания. Ты показала, что ее мнение имеет вес. Она победила в этой микробитве." }, { title: "Техника «Стеклянный купол»", desc: "Пропустить мимо ушей. Не реагировать на провокацию, сохраняя каменное лицо.", effect: 10, log: "Ты не дала ей обратной связи. Ее негатив ударился о купол и вернулся к ней. Ты в безопасности, а она осталась со своей злостью." }, { title: "Назвать вещи своими именами", desc: "«Я вижу, что ты недовольна. Скажи прямо, в чем дело».", effect: 15, log: "Ты вытащила ее пассивную агрессию на свет. Это трусость с ее стороны, и ты показала, что видишь это. Она не ожидала такого отпора." }, { title: "Атаковать в ответ", desc: "«А ты вообще на себя посмотри, прежде чем что-то говорить».", effect: -10, log: "Ты опустилась на ее уровень. Начался скандал. Ты слила свою энергию на пустую перепалку, вместо того чтобы сохранить спокойствие." }, { title: "Согласиться с улыбкой", desc: "«Да, я такая. И что? Мне нравится».", effect: 10, log: "Ты не стала оправдываться. Это обескуражило ее. Она не получила желаемой реакции, и ее пассивная агрессия разбилась о твою уверенность." } ] },
            { text: "Парень: «Ты слишком много читаешь и загоняешься. Все нормальные девушки гуляют и веселятся, а ты сидишь со своими книжками. Ты скучная и невыносимая».", inner: "Ты слышишь это в третий раз за неделю. Каждый раз, когда ты пытаешься отстоять свои интересы, тебя называют «не такой». Это классический газлайтинг.", cards: [ { title: "Поверить и сдаться", desc: "Может, он прав. Может, я действительно скучная и со мной что-то не так.", effect: -25, log: "Газлайтинг сработал. Ты начинаешь видеть себя его глазами. Твой свет гаснет, ты отказываешься от своих интересов ради его одобрения." }, { title: "Возврат проекции", desc: "«Это твое мнение. Мне нравится читать. Если тебе со мной скучно — это твоя проблема».", effect: 20, log: "Ты не берешь чужое на себя. Ты видишь его биологию: он боится твоего интеллекта и свободы. Ты остаешься на своей стороне." }, { title: "Агрессия в ответ", desc: "«А ты вообще ничего из себя не представляешь, кроме своих гулянок!»", effect: -15, log: "Скандал. Ты опускаешься на уровень рефлексов. Он добился эмоциональной реакции, чтобы манипулировать дальше. Ты потеряла контроль." }, { title: "Попытаться договориться", desc: "«Давай иногда гулять, а иногда читать. Найдем компромисс».", effect: -5, log: "Ты прогнулась. Он продолжит обесценивать твои интересы. Компромисс с токсичным человеком — это всегда путь в одну сторону." }, { title: "Молча уйти", desc: "Ничего не отвечать. Просто встать и уйти, оставив его одного.", effect: 15, log: "Ты не тратишь слова на того, кто не слышит. Это сильный ход. Ты сохранила энергию и показала, что не собираешься участвовать в его спектакле." } ] },
            { text: "Ты пишешь парню, который тебе нравится. Он прочитал сообщение два часа назад. И молчит. Ты видишь, как он лайкает фотографии других девушек.", inner: "Ты ищешь оправдания. «Он занят». «Он устал». «Он не заметил». Ты хочешь верить в лучшее. Но игнор — это уже ответ.", cards: [ { title: "Написать еще раз", desc: "«Ты тут?» «Может, встретимся?»", effect: -20, log: "Ты проявляешь навязчивость и теряешь самоценность. Игнор — это сигнал. Ты тратишь время на того, кто этого не ценит." }, { title: "Признать факт", desc: "Игнор — это сигнал. Уйти в тишину и заняться собой.", effect: 15, log: "Ты приняла реальность. Ты не тратишь свой ресурс на пустоту. Ты выбираешь себя и свою жизнь, а не ожидание." }, { title: "Обесценить его", desc: "«Да он вообще козел, не нужен мне».", effect: -5, log: "Ты пытаешься защититься, но внутри осталась обида. Ты не отпустила ситуацию, а просто спрятала боль под маской агрессии." }, { title: "Позвонить", desc: "Набрать ему прямо сейчас, чтобы прояснить ситуацию.", effect: -15, log: "Ты проявляешь навязчивость. Он чувствует свою власть. Ты отдаешь ему контроль над своим эмоциональным состоянием." }, { title: "Удалить чат", desc: "Стереть переписку и забыть его.", effect: 10, log: "Ты закрыла эту дверь. Освободила место для нового. Это не бегство, это осознанное решение не тратить себя на пустоту." } ] },
            { text: "Твоя подруга жалуется на жизнь, но ничего не меняет. Ты выслушиваешь ее часами, даешь советы, помогаешь. А она продолжает жить в хаосе и жаловаться дальше.", inner: "Ты чувствуешь ее боль как свою. Ты хочешь ее спасти. Но ты чувствуешь, что выгораешь. Ты путаешь эмпатию с ответственностью.", cards: [ { title: "Спасать дальше", desc: "Я не могу ее бросить. Я должна помочь. Я не имею права уйти.", effect: -25, log: "Ты путаешь эмпатию с ответственностью. Ты не обязана спасать всех. Ее жизнь — это ее зона контроля. Ты теряешь свой ресурс." }, { title: "Разделение ответственности", desc: "«Я не несу ответственность за их эмоции. Это их жизнь, их выбор».", effect: 15, log: "Ты вернула себе границы. Ты можешь сочувствовать, но не обязана тонуть вместе с ними. Это здоровый подход." }, { title: "Уйти в игнор", desc: "Просто перестать отвечать ей навсегда без объяснений.", effect: -10, log: "Ты не объяснила границы, а просто сбежала. Внутри осталось чувство вины. Это нездоровый паттерн." }, { title: "Дать совет", desc: "Попытаться решить ее проблему за нее.", effect: -5, log: "Она не хочет решать проблему. Она хочет жаловаться. Ты тратишь энергию впустую, пытаясь изменить то, что не в твоей власти." }, { title: "Сказать прямо", desc: "«Я устала слушать одно и то же. Давай поговорим о чем-то другом или я пойду».", effect: 15, log: "Ты обозначила границу общения. Это может показаться жестким, но это честно. Ты сохранила свой ресурс." } ] },
            { text: "Ты смотришь в зеркало и чувствуешь отвращение. Ты снова сорвалась на сладкое, хотя обещала себе. В голове голос: «Ты безвольная, ты никогда не похудеешь».", inner: "Ты сравниваешь себя с отфотошопленными картинками из соцсетей. Ты забываешь, что тело — это не враг. Это задержка воды, углеводы, стресс. Мозг ищет быстрый дофамин.", cards: [ { title: "Наказать себя", desc: "Пропустить прием пищи или пойти на изнурительную тренировку.", effect: -30, log: "Ты воюешь с телом. Голодовка забирает ресурс. Психика ломается. Ты становишься слабее. Это не решение." }, { title: "Партнерство с телом", desc: "«Я не робот. Я покормлю себя нормально и отдохну».", effect: 20, log: "Ты перестала воевать. Тело ответит тебе благодарностью. Питание и отдых дают ресурс. Ты становишься сильнее." }, { title: "Заесть стресс", desc: "Съесть торт, чтобы заглушить боль.", effect: -15, log: "Кратковременное облегчение, но потом чувство вины вернется с новой силой. Это порочный круг." }, { title: "Проанализировать", desc: "«Чего я на самом деле хочу? Тепла? Отдыха? Заботы?»", effect: 15, log: "Ты поняла причину. Заменила суррогат заботой. Это осознанный подход к своим потребностям." }, { title: "Сменить фокус", desc: "Пойти прогуляться или заняться хобби.", effect: 10, log: "Ты переключила внимание. Новизна стимулирует дофамин. Это не решение проблемы, но это способ снять напряжение." } ] },
            { text: "Ты лежишь на кровати третий день. Нет сил даже помыть голову. Мама говорит: «Соберись, ты просто ленивая. В наше время не было депрессии».", inner: "Ты чувствуешь себя бесполезной. В голове туман. Ты ругаешь себя за то, что не можешь «взять себя в руки». Это не лень. Это падение дофамина и серотонина.", cards: [ { title: "Согласиться с мамой", desc: "Да, я просто ленивая. Надо взять себя в руки.", effect: -25, log: "Ты ругаешь себя за болезнь. Это не лень. Это падение дофамина и серотонина. Ты не виновата. Но ты усугубляешь состояние." }, { title: "Признать болезнь", desc: "Понять: это не лень, а симптом. Найти врача или просто дать себе паузу.", effect: 20, log: "Ты понимаешь, что антидепрессанты — это костыль для сломанной ноги. Взять паузу — правильный шаг. Ты лечишь причину." }, { title: "Игнорировать", desc: "Просто заставить себя делать всё через силу.", effect: -10, log: "Ты пытаешься бежать со сломанной ногой. Ресурс кончится еще быстрее. Это путь к истощению." }, { title: "Объяснить маме", desc: "«Это не лень, это симптом. Мне нужна помощь».", effect: 15, log: "Ты отстояла свое состояние. Возможно, мама не поймет сразу, но ты сделала шаг к защите себя." }, { title: "Найти специалиста", desc: "Записаться к психологу или психиатру.", effect: 25, log: "Ты лечишь причину, а не следствие. Это самый взрослый и ответственный шаг из всех возможных." } ] },
            { text: "Ты добилась успеха. Купила себе что-то дорогое, получила повышение. В ответ ты слышишь: «Ну повезло. Небось через постель. Выскочка».", inner: "Они не знают, сколько ты работала. Они видят только результат и пытаются его обесценить, чтобы самим не чувствовать своей неполноценности.", cards: [ { title: "Оправдываться", desc: "Доказывать им, что ты работала честно.", effect: -20, log: "Ты тратишь энергию на доказательства. Они всё равно не поверят. Это их уровень. Ты не обязана никому ничего доказывать." }, { title: "Наблюдатель", desc: "Посмотреть на них как на животных. Они просто завидуют.", effect: 15, log: "Ты видишь их проекции. Это их страх и грязь. Ты не берешь это на себя. Ты — оригинал, они — копии." }, { title: "Ответить гадостью", desc: "«А вы вообще ничего не добились».", effect: -10, log: "Ты сливаешься с ними в одном болоте. Ты опускаешься на их уровень. Это не твой путь." }, { title: "Согласиться", desc: "«Да, мне повезло. И я много работала».", effect: 15, log: "Ты не отрицаешь удачу, но и не обесцениваешь свой труд. Это здоровая позиция." }, { title: "Игнорировать", desc: "Не вступать в диалог, пройти мимо.", effect: 10, log: "Ты сохранила энергию. Их слова не стоят твоего внимания. Ты выбрала себя." } ] },
            { text: "Ты читаешь свой старый пост или смотришь на старые фото и думаешь: «Какая я была глупая. Какой ужасный стиль. Как я могла так выглядеть?»", inner: "Ты ругаешь себя прошлую. Ты забываешь, что именно та версия тебя привела к тому, кем ты стала сейчас. Эволюция — это рост.", cards: [ { title: "Ненавидеть прошлое", desc: "Стереть все старые фото, чтобы не позориться.", effect: -15, log: "Ты отвергаешь свой опыт. Тот человек делал всё, что мог, с теми ресурсами, что были. Без нее не было бы тебя сегодняшней." }, { title: "Благодарность", desc: "«Спасибо тебе прошлой. Ты справлялась как могла».", effect: 20, log: "Ты принимаешь свой путь. Эволюция — это рост. Ты продолжаешь расти и ценить свой опыт." }, { title: "Сравнивать", desc: "Сравнивать себя с другими, у кого всё «идеально» в соцсетях.", effect: -10, log: "Сравнение убивает радость. Ты не знаешь их пути, а они не знают твоего. Это ловушка." }, { title: "Смеяться", desc: "«Да, это было забавно. Зато сейчас я другая».", effect: 10, log: "Легкость к себе. Принятие своего пути. Это здоровая самоирония." }, { title: "Анализ", desc: "«Что я поняла с тех пор? Как я выросла?»", effect: 15, log: "Ты видишь прогресс. Это укрепляет твою самооценку и веру в себя." } ] },
            { text: "Тебе нужно сделать важное дело. Ты откладываешь его уже неделю. Ты чувствуешь вину и тревогу. В голове голос: «Ты безвольная, ты ничего не добьешься».", inner: "Прокрастинация — это не лень. Это избегание дискомфорта. Мозг боится, что не получится идеально, и выбирает знакомое бездействие.", cards: [ { title: "Ругать себя", desc: "Какой же я безвольный кусок. Надо просто взять и сделать.", effect: -20, log: "Самокритика снижает мотивацию. Поддержка себя работает лучше, чем наказание. Ты только усугубляешь стресс." }, { title: "Снизить планку", desc: "«Сделаю плохо, но сделаю». Начать с 5 минут.", effect: 20, log: "Действие рождает энергию. Первый шаг разрывает петлю застоя. Ты обманываешь мозг, и дело начинает двигаться." }, { title: "Ждать вдохновения", desc: "Сяду, когда будет настроение.", effect: -10, log: "Вдохновение — это миф. Дальше работает привычка и дисциплина. Ты можешь ждать вечно." }, { title: "Разбить на шаги", desc: "Открыть документ и написать одно предложение.", effect: 15, log: "Маленькие победы дают дофамин. Это топливо для дальнейшего движения. Ты обхитрила прокрастинацию." }, { title: "Пообещать награду", desc: "Сделаю дело, а потом съем вкусняшку.", effect: 10, log: "Дофаминовая система работает. Ты даешь мозгу стимул. Это рабочий метод." } ] },
{ text: "Ты надела то, что тебе действительно нравится. Выходишь на улицу и ловишь на себе косые, осуждающие взгляды прохожих.", inner: "Твоё тело — только твое. Ты выбираешь, что с ним будет, кто его будет касаться и как оно будет выглядеть. Чужое мнение о твоей внешности — это их проекции и их ограничения.", cards: [ { title: "Спрятаться", desc: "Накинуть куртку, чтобы не привлекать внимание и слиться с толпой.", effect: -20, log: "Ты предала себя ради чужого комфорта. Это не твоя зона ответственности. Ты позволила им решать, как тебе выглядеть." }, { title: "Принять свое тело", desc: "«Мое тело — мое дело. Я наслаждаюсь собой и тем, как я выгляжу».", effect: 20, log: "Ты на своей стороне. Чужие проекции не имеют значения. Это высший уровень свободы и самоценности." }, { title: "Ответить агрессией", desc: "«Чего уставились, извращенцы!»", effect: -10, log: "Ты дала им реакцию. Они получили свою порцию дофамина, увидев твои эмоции. Ты слила энергию." }, { title: "Внутренняя опора", desc: "Почувствовать стопы на полу, сделать глубокий выдох, мысленно сказать «Я в безопасности».", effect: 15, log: "Заземление. Ты вернулась в реальность, отключила эмпатическую тревогу и сохранила спокойствие." }, { title: "Сменить фокус", desc: "Заняться своими делами, вообще забыть об этих людях.", effect: 10, log: "Их взгляды не определяют тебя. Ты выбрала свой путь и не тратишь время на пустоту." } ] },
            { text: "Парень в соцсетях пишет тебе: «Ты красивая, давай общаться, я тебя хочу». Ты смотришь на его профиль и видишь, что он примитивен и мыслит только базовыми инстинктами.", inner: "Инстинкт размножения берет над ними верх. Это не эволюция, это деградация. Они видят в тебе не личность, а кусок мяса. Ты на другом уровне осознанности.", cards: [ { title: "Объяснять", desc: "Пытаться доказать ему, что он примитивен и ведет себя как животное.", effect: -15, log: "Ты тратишь свой ресурс на неразумного. Это как спорить с собакой. Он все равно не поймет." }, { title: "Игнорировать", desc: "Молча заблокировать. Умные люди не тратят слова на пустоту.", effect: 15, log: "Ты не втягиваешься в игры животных. Твой мир — только твой. Ты сохранила свой ресурс." }, { title: "Оскорбить", desc: "Написать ему, что он животное и деградант.", effect: -5, log: "Ты получила быстрый дофамин, но слила энергию в чужую жизнь. Он добился твоей реакции." }, { title: "Пожалеть", desc: "«Он просто неразвит, живет на уровне инстинктов».", effect: 5, log: "Ты не включаешься в конфликт. Наблюдаешь со стороны. Это позиция Желтого уровня." }, { title: "Потроллить", desc: "Написать что-то странное и заблокировать, чтобы он завис в недоумении.", effect: 10, log: "Ты поиграла и ушла. Без ущерба для себя. Но это все еще игра на их поле." } ] },
            { text: "Мама говорит: «Ты всегда была ленивой. Ничего у тебя не получится». Хотя тебе уже 30 лет, и ты давно живешь своей жизнью.", inner: "Они видят тебя ребенком. Их картинка — это не ты. Это их восприятие, ожидания, память. Ты для них — версия. Не оригинал. И это освобождает.", cards: [ { title: "Спорить", desc: "Доказывать ей, что ты давно изменилась и добилась успеха.", effect: -10, log: "Люди не меняются от разговоров. Только от собственного осознания. Ты тратишь энергию на бесполезный спор." }, { title: "Принять факт", desc: "«Это их версия меня. Я не обязана ей соответствовать».", effect: 20, log: "Ты для всех — версия. Не оригинал. И это освобождает. Ты перестала тратить силы на их иллюзии." }, { title: "Обидеться", desc: "Уйти в комнату и плакать от несправедливости.", effect: -20, log: "Обида — это подавленная злость. Ты наказываешь себя за их слова. Ты берешь их проекции на себя." }, { title: "Отделиться", desc: "«Я понимаю, что ты так думаешь. Я так не считаю».", effect: 15, log: "Ты отделила свое мнение от ее. Ты сохранила свою реальность и не втянулась в конфликт." }, { title: "Уйти", desc: "Выйти из комнаты, не говоря ни слова.", effect: 10, log: "Физическая граница. Ты не обязана слушать то, что тебя разрушает." } ] },
            { text: "Ты листаешь ленту в соцсетях и видишь чужой успех: кто-то купил квартиру, кто-то вышел замуж, кто-то открыл бизнес. Ты чувствуешь укол зависти и неполноценности.", inner: "Ты видишь финал, а не путь. Не знаешь, сколько лет, ошибок и падений за этим. Сравнивать свой старт с чужим этапом — нечестно по отношению к себе.", cards: [ { title: "Завидовать", desc: "Чувствовать себя неполноценной, думать, что ты неудачница.", effect: -25, log: "Зависть — это быстрый дофамин. Мозгу проще завидовать, чем строить свою жизнь. Ты разрушаешь свою самооценку." }, { title: "Сменить фокус", desc: "Сравнивать себя только с собой вчерашней. Замечать свои шаги.", effect: 20, log: "Ты идешь своим темпом. Это не медленно. Это твой путь. Ты видишь свой прогресс, а не чужой." }, { title: "Обесценить", desc: "«У них все куплено, это фейк и фотошоп».", effect: -10, log: "Ты защищаешь свое Эго, но не развиваешься. Ты закрываешь глаза на реальность." }, { title: "Вдохновиться", desc: "Записать идею, что можно улучшить в своей жизни, глядя на них.", effect: 15, log: "Мотивация. Ты превратила зависть в топливо для своего роста." }, { title: "Закрыть соцсеть", desc: "Убрать триггер, выйти из приложения.", effect: 10, log: "Меньше шума, больше концентрации на себе. Это забота о своем психическом здоровье." } ] },
            { text: "Ты чувствуешь сильную злость на человека, который нарушил твои границы. Ты хочешь высказать ему всё прямо сейчас.", inner: "Злость — это вторичная эмоция. Под ней почти всегда страх, боль или бессилие. Это сигнал, что твои границы нарушены.", cards: [ { title: "Выплеснуть", desc: "Наорать на него прямо сейчас, высказать всё, что думаешь.", effect: -20, log: "Ты дала эмоции захватить контроль. Это уровень рефлексов. Ты можешь наговорить лишнего и пожалеть об этом." }, { title: "Пауза", desc: "Сделать вдох, выдох. Понять, какая боль стоит за злостью.", effect: 15, log: "Между стимулом и реакцией есть зазор. В нем — твоя свобода. Ты выбрала осознанную реакцию." }, { title: "Задавить", desc: "Сделать вид, что всё нормально, проглотить обиду.", effect: -15, log: "Подавленные эмоции уходят в тело: зажимы, тревога, бессонница. Это не решение проблемы." }, { title: "Написать на бумаге", desc: "Выписать все, что чувствуешь, и порвать лист.", effect: 20, log: "Экологичный выход эмоций. Ты освободилась от груза, не причинив вреда ни себе, ни другим." }, { title: "Проговорить", desc: "Сказать себе: «Я злюсь, потому что...». Назвать эмоцию.", effect: 10, log: "Названная эмоция теряет силу. Ты взяла ее под контроль." } ] },
            { text: "Ты хочешь изменить свою жизнь (начать бегать, учить язык, сменить работу), но старые привычки тянут назад. Мозг выбирает знакомое.", inner: "Мозг экономит энергию. Он выбирает привычное, даже если оно вредно. Но нейропластичность сохраняется всю жизнь. Ты можешь создать новые связи.", cards: [ { title: "Сдаться", desc: "Я уже не могу измениться. Возраст не тот. Это не для меня.", effect: -25, log: "Это удобная ложь. Мозг растет, пока ты его тренируешь. Ты сама закрываешь себе путь." }, { title: "Маленький шаг", desc: "Сделать 1% усилия. Надеть кроссовки и выйти на 5 минут.", effect: 20, log: "Действие рождает энергию. Привычка закрепляется через повторение. Ты обхитрила свой мозг." }, { title: "Ждать мотивации", desc: "Сяду, когда будет настроение и желание.", effect: -10, log: "Вдохновение — это миф. Дальше работает привычка и дисциплина. Ты можешь ждать вечно." }, { title: "Сменить контекст", desc: "Начать делать это в новом месте, в другое время.", effect: 15, log: "Мозг легче создает новые связи, когда меняется обстановка. Это рабочий лайфхак." }, { title: "Найти поддержку", desc: "Рассказать другу о своей цели, попросить его контролировать.", effect: 10, log: "Внешняя опора. Это помогает не сорваться в начале пути." } ] },
            { text: "У тебя много энергии. Ты чувствуешь прилив сил, но тратишь его на скроллинг ленты, споры в интернете и пустую суету.", inner: "Энергия требует выхода. Если не направить её сознательно — она найдет разрушительный выход. Это закон физики и биологии.", cards: [ { title: "Скроллинг", desc: "Продолжать листать ленту, не замечая времени.", effect: -20, log: "Мозгу нужна стимуляция. Нет полезной — найдет разрушительную. Ты теряешь время и ресурс." }, { title: "Направить в дело", desc: "Заняться спортом, творчеством или обучением.", effect: 20, log: "Энергия не бывает лишней. Она бывает бесхозной. Ты направила ее в рост." }, { title: "Направить в конфликт", desc: "Найти, с кем поспорить в интернете, доказать свою правоту.", effect: -15, log: "Ты сливаешь ресурс на чужую жизнь, чужие тела и чужие проблемы. Это пустая трата." }, { title: "В обучение", desc: "Прочитать полезную статью или посмотреть лекцию.", effect: 15, log: "Рост. Ты инвестируешь свою энергию в себя." }, { title: "В отдых", desc: "Сходить на прогулку, чтобы выпустить пар.", effect: 10, log: "Восстановление. Иногда лучший способ потратить энергию — это дать себе отдохнуть." } ] },
            { text: "Ты можешь убедить себя в чем угодно. Что ты гений. Что ты жертва. Что ты ничтожество. И ты начинаешь верить в этот образ.", inner: "Это защитные механизмы. Ты смотришь на себя через кривое зеркало травм и комплексов. Без самоанализа ты просто веришь в свои фантазии.", cards: [ { title: "Поверить в фантазию", desc: "Я гений/ничтожество, и точка. Так и есть.", effect: -25, log: "Без самоанализа ты просто веришь в свои фантазии. Ты теряешь связь с реальностью. Это путь в никуда." }, { title: "Рефлексия", desc: "Проверять мысли фактами. Признавать ошибки и слабости.", effect: 20, log: "Ты не персонаж, а живой, меняющийся человек. Ум — это про рефлексию. Ты вернулась в реальность." }, { title: "Игнорировать", desc: "Не думать об этом вообще, просто жить.", effect: -10, log: "Отсутствие рефлексии — это путь в никуда. Ты продолжаешь жить в иллюзии." }, { title: "Спросить другого", desc: "«Как ты видишь эту ситуацию? Как ты видишь меня?»", effect: 15, log: "Взгляд со стороны. Это помогает увидеть слепые зоны." }, { title: "Принять факт", desc: "«Я обычный человек с ошибками и достоинствами».", effect: 10, log: "Снятие напряжения. Ты перестала быть заложником своего Эго." } ] },
            { text: "Ты видишь, как люди вокруг сплетничают, завидуют, копируют друг друга. Тебя это бесит и вызывает чувство брезгливости.", inner: "Они на другом уровне. Красный/Оранжевый. Их психика требует подтверждения статуса. Ты на Желтом. Ты видишь систему.", cards: [ { title: "Опуститься до них", desc: "Начать сплетничать в ответ, чтобы быть «в стае».", effect: -30, log: "Ты включилась в игру «животного уровня». Ты теряешь свою идентичность. Это деградация." }, { title: "Наблюдатель", desc: "Смотреть с кинжом и дистанцированием. Понимать, что они не могут иначе.", effect: 25, log: "Ты — оригинал. Они — копии. Ты свободна и видишь систему. Это позиция Желтого уровня." }, { title: "Спасать их", desc: "Пытаться объяснить им их ошибки и поднять их уровень.", effect: -20, log: "Они не хотят развиваться. Это их зона комфорта. Не трать слова." }, { title: "Дистанцироваться", desc: "Свести общение с ними к минимуму, чтобы не пачкаться.", effect: 15, log: "Сохранение ресурса. Ты защищаешь себя от токсичной среды." }, { title: "Понять", desc: "«Их психика требует подтверждения статуса. Это их уровень».", effect: 10, log: "Меньше отвращения. Ты понимаешь их природу, и это освобождает тебя от негатива." } ] },
{ text: "Ты зациклилась на одной мысли. Крутишь один и тот же сценарий в голове: кто что сказал, как надо было ответить, почему это произошло. Ты не можешь остановиться.", inner: "Останавливать — не значит подавлять. Это значит замечать и выбирать. Между стимулом и реакцией есть пауза. В ней — твоя свобода.", cards: [ { title: "Крутить дальше", desc: "Додумать до конца, найти все причины и виноватых.", effect: -25, log: "Ты не решаешь проблему, ты прокручиваешь тревогу. Мозг замылился. Ты теряешь ресурс впустую." }, { title: "Остановка", desc: "Вдох. Пауза 3 секунды. «Это про сейчас или про прошлое?»", effect: 20, log: "В паузе рождается свобода. Ты управляешь, а не реагируешь на автопилоте. Мысль теряет власть." }, { title: "Отвлечься", desc: "Залипнуть в телефон, чтобы не думать об этом.", effect: -15, log: "Это не отдых, это дофаминовая яма. Мозг устает от переключения внимания. Проблема осталась." }, { title: "Заземлиться", desc: "Назвать 5 предметов вокруг, почувствовать стопы на полу.", effect: 15, log: "Возврат в реальность. Ты выключила внутренний диалог и вернулась в настоящий момент." }, { title: "Записать", desc: "Выписать эту мысль на бумагу, чтобы она перестала быть в голове.", effect: 10, log: "Структурирование хаоса. Когда мысль на бумаге, она уже не так пугает." } ] },
            { text: "Кажется, что у тебя нет дел. Внутри туман. Ты чувствуешь апатию и ничего не хочешь делать. Ты просто лежишь и смотришь в потолок.", inner: "«У меня нет дел» — почти всегда неправда. Это либо перегрузка, либо нет ясности. Мозг не видит, с чего начать, и выдает «ничего не надо».", cards: [ { title: "Лежать дальше", desc: "Ждать, когда само пройдет. Может, завтра будет лучше.", effect: -20, log: "Бездействие — это не отдых, это туман, который копится. Ты увязаешь глубже." }, { title: "Выгрузить на бумагу", desc: "Выписать всё, даже мелочи. Выбрать одно самое маленькое действие.", effect: 20, log: "Мозг получает сигнал «я сделала». Дальше становится легче. Ты выходишь из ступора." }, { title: "Ругать себя", desc: "«Соберись, тряпка. Нельзя быть такой ленивой».", effect: -15, log: "Самокритика снижает мотивацию. Поддержка себя работает лучше. Ты только усугубляешь апатию." }, { title: "Выбрать одно дело", desc: "Самое простое: помыть одну чашку или вынести мусор.", effect: 15, log: "Выход из ступора. Маленькое действие запускает двигатель." }, { title: "Отдохнуть", desc: "Разрешить себе ничего не делать без чувства вины.", effect: 10, log: "Восстановление. Иногда апатия — это сигнал, что телу нужен покой." } ] },
            { text: "Ты живешь на автопилоте. Ешь, не чувствуя вкуса. Листаешь ленту, не помня что. Злишься, не понимая почему. Дни сливаются в один.", inner: "Мозг экономит энергию. Но ты можешь вернуть контроль через наблюдение. Наблюдение — это не осуждение. Это возвращение к себе.", cards: [ { title: "Автопилот", desc: "Продолжать жить как робот, не замечая ничего вокруг.", effect: -25, log: "Ты теряешь связь с собой и телом. Жизнь проходит мимо. Это медленное умирание." }, { title: "Наблюдатель", desc: "3 раза в день спрашивать: «Что я сейчас делаю? Что я чувствую?»", effect: 20, log: "Наблюдение — это возвращение к себе. Каждый раз, когда замечаешь, ты уже не на автопилоте." }, { title: "Бежать от себя", desc: "Загрузить себя делами до предела, чтобы не думать.", effect: -10, log: "Ты пытаешься заглушить внутренний шум внешней суетой. Это не работает." }, { title: "Фокус на теле", desc: "Почувствовать стопы на полу, дыхание, напряжение в плечах.", effect: 15, log: "Заземление. Ты вернулась в настоящий момент через тело." }, { title: "Выйти", desc: "Умыться холодной водой, выйти на улицу.", effect: 10, log: "Разрыв шаблона. Физическое действие помогает переключить состояние." } ] },
            { text: "Ты не знаешь, куда уходит день. Ты чувствуешь, что устаешь, но ничего не успеваешь. Время утекает сквозь пальцы.", inner: "Время — это ресурс, который не вернуть. Замечать его — не паранойя. Это уважение к себе и своей жизни.", cards: [ { title: "Игнорировать", desc: "Плыть по течению, как получится. Будь что будет.", effect: -20, log: "Ты теряешь время на чужие проблемы и тревогу. Твоя жизнь проходит мимо." }, { title: "Записать факты", desc: "2-3 дня записывать, чем занята. Без оценки. Просто факты.", effect: 20, log: "Ты видишь реальность. Что оставить, а что убрать. Появляется ясность." }, { title: "Завиноватиться", desc: "«Я опять всё профукала. Я ничего не успеваю».", effect: -15, log: "Вина мешает видеть реальность. Это просто факты, а не приговор." }, { title: "Таймер", desc: "Работать 25 минут, отдыхать 5. Структурировать день.", effect: 15, log: "Структура снижает тревогу. Ты берешь время под контроль." }, { title: "Убрать лишнее", desc: "Отказаться от одного дела, которое не твое.", effect: 10, log: "Делегирование ресурса. Ты освобождаешь место для важного." } ] },
            { text: "Ты чувствуешь пустоту. Ничего не радует, всё кажется бессмысленным. Ты не понимаешь, зачем вообще что-то делать.", inner: "Смысл — это не данность. Это то, что ты создаешь через действия, связи и выбор. Само не станет. Страдание — это часто игнорирование базы.", cards: [ { title: "Ждать чуда", desc: "Смысл придет сам, нужно просто подождать.", effect: -20, log: "Само не станет. Страдание — это часто игнорирование базы. Ты увязаешь в пустоте." }, { title: "Создавать смысл", desc: "Сделать маленький шаг: помочь кому-то, создать что-то, даже если не хочется.", effect: 20, log: "Действие рождает энергию. Смысл появляется в процессе, а не до него." }, { title: "Уйти в зависимость", desc: "Алкоголь, еда, сериалы, чтобы заглушить пустоту.", effect: -25, log: "Побег от себя. Это разрушает мозг и тело. Пустота останется." }, { title: "База", desc: "Проверить сон, еду, воду. Наладить физическое состояние.", effect: 15, log: "Психике нужно восстановление. Часто пустота — это просто истощение." }, { title: "Новизна", desc: "Пойти новым маршрутом, попробовать новое блюдо.", effect: 10, log: "Новизна стимулирует дофамин. Это маленькая искра интереса." } ] },
            { text: "Ты боишься будущего. Не знаешь, что будет завтра. Тревога сковывает тело и не дает дышать.", inner: "Неопределенность не убирается. Ее нельзя «переждать». Она с тобой всю жизнь. Задача не избавиться, а научиться с ней жить.", cards: [ { title: "Контроль", desc: "Пытаться всё предусмотреть и просчитать на годы вперед.", effect: -20, log: "Чем больше пытаешься всё держать под контролем, тем сильнее напряжение. Ты истощаешься." }, { title: "Опора на настоящее", desc: "«Я справлялась раньше — справлюсь и сейчас». Фокус на том, что контролируешь.", effect: 20, log: "Неопределенность — не враг. Это пространство, в котором ты живешь. Ты возвращаешь себе силу." }, { title: "Паниковать", desc: "Прокручивать худшие сценарии в голове.", effect: -25, log: "Мозг не отличает реальное от воображаемого. Ты проживаешь страх как настоящий." }, { title: "Дыхание", desc: "Вдох на 4, задержка на 7, выдох на 8. Снизить накал.", effect: 15, log: "Активация парасимпатической системы. Тело успокаивается, тревога отступает." }, { title: "Принять факт", desc: "«Я не обязана знать всё заранее».", effect: 10, log: "Свобода от иллюзии контроля. Это зрелая позиция." } ] },
            { text: "Жизнь кажется слишком серьезной. Ты чувствуешь тяжесть от каждого решения. Каждая ошибка кажется фатальной.", inner: "Строй жизнь как игру. В игре ты не ждешь одобрения, просто пробуешь, копишь, создаешь. То, что не контролируешь — условия игры. То, что можешь — твой процесс.", cards: [ { title: "Всё усложнять", desc: "Думать о жизни как о наказании. Каждое решение — вопрос жизни и смерти.", effect: -20, log: "Жизнь — не боль. Если ты сам так не решил. Ты создаешь себе лишний стресс." }, { title: "Играть", desc: "Относиться к жизни как к симулятору. Выполнять задания, развиваться.", effect: 20, log: "Ты не ждешь одобрения. То, что не контролируешь — условия игры. Это освобождает." }, { title: "Сдаться", desc: "«Всё бессмысленно, зачем стараться».", effect: -30, log: "Деградация — это не путь к хорошей жизни. Это застой вниз." }, { title: "Сменить роль", desc: "Представить себя персонажем, который точно справится.", effect: 15, log: "Игровая отстраненность. Ты снимаешь напряжение и находишь ресурс." }, { title: "Найти интерес", desc: "Заняться тем, что увлекает, забыть о серьезности.", effect: 10, log: "Потоковое состояние. Ты возвращаешься к жизни через интерес." } ] },
            { text: "Ты чувствуешь, что не вправе злиться. Тебе кажется, что злость — это плохо, и ты подавляешь ее в себе.", inner: "Злость — это сигнал, что границы нарушены. Это нормальная эмоция. Подавленная злость становится депрессией или психосоматикой.", cards: [ { title: "Подавить", desc: "Улыбаться и терпеть, делать вид, что всё хорошо.", effect: -20, log: "Зажимы в теле. Подавленные эмоции уходят в тело. Это путь к болезням." }, { title: "Признать", desc: "«Я злюсь, это нормально. Мои границы нарушены».", effect: 15, log: "Эмоция теряет силу, когда она названа. Ты возвращаешь себе контроль." }, { title: "Выплеснуть", desc: "Наорать на обидчика прямо сейчас.", effect: -10, log: "Скандал. Ты дала эмоции захватить контроль. Это не решает проблему." }, { title: "Проанализировать", desc: "«Какая именно граница была нарушена? Что я могу сделать?»", effect: 20, log: "Понимание. Ты превращаешь злость в действие и защиту себя." }, { title: "Уйти", desc: "Физически покинуть место, чтобы остыть.", effect: 10, log: "Защита. Ты не даешь ситуации усугубиться." } ] },
            { text: "Ты сравниваешь себя с другими. Тебе кажется, что все вокруг успешнее, красивее и счастливее, чем ты.", inner: "Ты видишь только финал, а не весь путь. Ты не знаешь, сколько лет, ошибок и падений за этим. Сравнение — это ловушка.", cards: [ { title: "Завидовать", desc: "Чувствовать себя хуже, думать, что ты неудачница.", effect: -25, log: "Токсичное чувство. Оно разрушает тебя изнутри и не помогает развиваться." }, { title: "Сравнить с собой", desc: "«Я вчерашняя vs я сегодняшняя». Замечать свой прогресс.", effect: 20, log: "Свой темп. Это честное сравнение, которое мотивирует." }, { title: "Вдохновиться", desc: "Увидеть, что возможно, и взять идею для себя.", effect: 15, log: "Мотивация. Ты превращаешь зависть в топливо." }, { title: "Обесценить", desc: "«У них все куплено, это фейк».", effect: -10, log: "Защита Эго. Ты закрываешь глаза на реальность и не растешь." }, { title: "Закрыть соцсети", desc: "Убрать триггер, выйти из приложения.", effect: 10, log: "Меньше шума. Ты защищаешь свое психическое здоровье." } ] },
            { text: "Ты не можешь отказать, когда тебя о чем-то просят. Ты боишься обидеть людей, поэтому берешь на себя чужую работу и проблемы.", inner: "Умение говорить «нет» — это забота о себе. Люди относятся к вам так, как вы сами позволяете к себе относиться.", cards: [ { title: "Согласиться", desc: "Опять взять чужое. Я же не могу подвести.", effect: -20, log: "Выгорание. Ты разрушаешь себя ради других. Это не любовь, это жертва." }, { title: "Отказать", desc: "«Извини, я не могу это сделать».", effect: 20, log: "Границы. Ты защищаешь свой ресурс. Это здоровый эгоизм." }, { title: "Найти отговорку", desc: "Соврать, чтобы не обидеть. Придумать причину.", effect: -10, log: "Страх конфликта. Ты сохраняешь видимость мира, но теряешь честность." }, { title: "Предложить альтернативу", desc: "«Я не сделаю это, но могу помочь иначе».", effect: 10, log: "Компромисс. Ты сохраняешь границы, но остаешься в контакте." }, { title: "Проигнорировать", desc: "Не отвечать на просьбу, сделать вид, что не заметила.", effect: -5, log: "Пассивная агрессия. Это трусость, которая портит отношения." } ] },
            { text: "Ты чувствуешь вину за отдых. Тебе кажется, что если ты просто сидишь и ничего не делаешь, то ты теряешь время и деградируешь.", inner: "Отдых — это не награда за труды, это базовая потребность. Без пауз эффективность падает, а тревога растет. Ты не робот.", cards: [ { title: "Продолжать работать", desc: "Через силу, пока не упаду. Отдыхать некогда.", effect: -25, log: "Ресурс падает. Ты выгораешь. Это прямой путь к депрессии и болезням." }, { title: "Разрешить себе", desc: "«Я имею право на паузу. Это часть процесса».", effect: 20, log: "Восстановление. Ты понимаешь, что отдых — это инвестиция в будущую продуктивность." }, { title: "Найти оправдание", desc: "«Я устала, поэтому можно». (Внутри все равно чувство вины).", effect: 5, log: "Все еще нуждается в доказательствах. Ты не можешь расслабиться по-настоящему." }, { title: "Заняться хобби", desc: "Сделать что-то для радости, а не для пользы.", effect: 15, log: "Восполнение. Ты переключила мозг на другой режим." }, { title: "Проверить тело", desc: "Прислушаться к усталости. Понять, что тело просит покоя.", effect: 10, log: "Контакт с собой. Ты учишься слышать сигналы организма." } ] },
            { text: "Ты боишься осуждения за свой выбор. Тебе кажется, что если ты сделаешь что-то не так, как принято, все будут смеяться и обсуждать тебя.", inner: "Люди редко думают о тебе. Они заняты собой. Их мнение — это их проекции, а не факт о тебе. Ты для них — версия.", cards: [ { title: "Замереть", desc: "Ничего не делать. Стоять на месте из-за страха.", effect: -20, log: "Страх парализует. Ты не живешь свою жизнь, а проживаешь чужой сценарий." }, { title: "Сделать", desc: "Сделать то, что хочется, несмотря на страх.", effect: 20, log: "Свобода. Ты выходишь из зоны комфорта и доказываешь себе, что можешь." }, { title: "Спросить", desc: "«А что подумают?» (Прокручивать в голове).", effect: -10, log: "Усиление тревоги. Ты кормишь свои страхи." }, { title: "Анализ", desc: "Понять, что их мнение — не факт. Это их интерпретация.", effect: 15, log: "Сепарация. Ты отделяешь себя от чужого мнения." }, { title: "Отвлечься", desc: "Заняться делом, чтобы не думать о страхе.", effect: 10, log: "Смена фокуса. Ты снижаешь уровень тревоги." } ] },
            { text: "Ты чувствуешь, что тебя используют. Люди обращаются к тебе только тогда, когда им что-то нужно, а потом пропадают.", inner: "Границы нужны, чтобы защитить себя. Ты не обязана быть удобной для всех. Люди относятся к тебе так, как ты позволяешь.", cards: [ { title: "Терпеть", desc: "Молчать дальше. Может, это просто совпадение.", effect: -25, log: "Истощение. Ты позволяешь вытирать об себя ноги. Это разрушает самооценку." }, { title: "Сказать нет", desc: "Отказать прямо. «Я не буду это делать».", effect: 20, log: "Освобождение. Ты показываешь, что с тобой так нельзя. Это защита." }, { title: "Уйти", desc: "Прекратить общение с этими людьми.", effect: 10, log: "Изоляция. Это не всегда плохо, если люди токсичны. Но это может быть бегством." }, { title: "Манипулировать", desc: "Ответить тем же. Использовать их в ответ.", effect: -15, log: "Токсичность. Ты становишься такой же, как они." }, { title: "Обсудить", desc: "Попытаться договориться, проговорить границы.", effect: 15, log: "Диалог. Это взрослый подход, если человек готов слышать." } ] },
            { text: "Ты чувствуешь, что не можешь контролировать свою жизнь. События идут не по плану, и ты теряешь почву под ногами.", inner: "Контроль — это иллюзия, но опора — реальна. Ты не можешь контролировать всё, но можешь контролировать свои реакции и шаги.", cards: [ { title: "Сдаться", desc: "Плыть по течению. Будь что будет.", effect: -20, log: "Пассивность. Ты отдаешь свою жизнь в руки других." }, { title: "Найти опору", desc: "Сфокусироваться на том, что зависит от тебя. На своих действиях.", effect: 20, log: "Возврат силы. Ты берешь ответственность за то, что в твоей власти." }, { title: "Тревожиться", desc: "Пытаться все просчитать и предусмотреть.", effect: -15, log: "Хаос. Чем больше контроля, тем больше напряжения." }, { title: "Принять", desc: "Отпустить ситуацию. Позволить жизни течь.", effect: 15, log: "Свобода. Это не сдача, это мудрость." }, { title: "Сменить фокус", desc: "Заняться телом: спорт, дыхание.", effect: 10, log: "Заземление. Ты возвращаешься в настоящий момент." } ] },
            { text: "Ты чувствуешь, что тебе не хватает поддержки. Тебе кажется, что ты одна в этом мире, и никто не может тебе помочь.", inner: "Ты можешь стать поддержкой для себя сама. Похвала и опора изнутри работают лучше, чем поиск одобрения извне.", cards: [ { title: "Ждать", desc: "Ждать, что кто-то придет и спасет.", effect: -25, log: "Разочарование. Ты перекладываешь ответственность за свою жизнь на других." }, { title: "Похвалить себя", desc: "Признать свои усилия. Сказать себе «я молодец».", effect: 20, log: "Внутренняя опора. Ты становишься на свою сторону." }, { title: "Попросить", desc: "Обратиться за помощью к тем, кто может ее оказать.", effect: 15, log: "Открытость. Просить помощь — это не слабость, а мудрость." }, { title: "Жалеть себя", desc: "Уйти в страдания и роль жертвы.", effect: -10, log: "Роль жертвы. Это дает временное облегчение, но не решает проблему." }, { title: "Сменить фокус", desc: "Пойти погулять, переключиться.", effect: 10, log: "Ресурс. Смена обстановки помогает взглянуть на ситуацию иначе." } ] },
            { text: "Ты чувствуешь, что ты не на своем месте. Работа, окружение или отношения кажутся тебе чужими, не твоими.", inner: "Ты имеешь право менять свою жизнь. Ты не обязана оставаться там, где тебе плохо. Это не эгоизм, это самосохранение.", cards: [ { title: "Терпеть", desc: "Оставаться ради стабильности и привычки.", effect: -25, log: "Застой. Ты предаешь себя ради иллюзии безопасности." }, { title: "Искать новое", desc: "Пробовать разные варианты, исследовать.", effect: 20, log: "Рост. Ты расширяешь свою зону комфорта." }, { title: "Строить планы", desc: "Прописать шаги к изменениям. План на год.", effect: 15, log: "Ясность. Ты переводишь мечты в реальность." }, { title: "Бояться", desc: "Оставаться на месте из-за страха перемен.", effect: -15, log: "Страх. Ты позволяешь страху управлять твоей жизнью." }, { title: "Пробовать", desc: "Сделать маленький шаг уже сегодня.", effect: 10, log: "Действие. Это начало пути." } ] },
            { text: "Ты чувствуешь, что не имеешь права на ошибку. Ты боишься сделать что-то не идеально, поэтому либо не делаешь вообще, либо изводишь себя.", inner: "Ошибка — это опыт, а не приговор. Психика не растет на идеальности, она растет на пробах и промахах.", cards: [ { title: "Идеальность", desc: "Пытаться всё сделать безупречно. Не начинать, пока не буду готова.", effect: -20, log: "Перфекционизм парализует. Ты никогда не начнешь." }, { title: "Разрешить ошибку", desc: "«Я могу ошибаться. Это нормально».", effect: 20, log: "Свобода. Ты снимаешь с себя груз идеальности." }, { title: "Отложить", desc: "Не делать, чтобы не ошибиться.", effect: -15, log: "Прокрастинация. Ты упускаешь возможности." }, { title: "Анализ", desc: "«Что я узнаю из этого опыта, даже если ошибусь?»", effect: 15, log: "Рост. Ты фокусируешься на процессе, а не на результате." }, { title: "Спросить", desc: "Совета у других, чтобы не ошибиться.", effect: 10, log: "Поддержка. Иногда это помогает снизить тревогу." } ] },
            { text: "Ты чувствуешь, что твои чувства обесценивают. Тебе говорят: «Да ладно, это ерунда, ты преувеличиваешь, не бери в голову».", inner: "Твои чувства реальны. Ты имеешь право их испытывать. Обесценивание — это форма психологического насилия.", cards: [ { title: "Согласиться", desc: "«Да, я преувеличиваю. Наверное, я слишком чувствительная».", effect: -25, log: "Газлайтинг себя. Ты начинаешь сомневаться в своей адекватности." }, { title: "Отстоять", desc: "«Мои чувства важны. Я так чувствую, и это не обсуждается».", effect: 20, log: "Самоценность. Ты защищаешь свою реальность." }, { title: "Уйти", desc: "Прекратить разговор, который обесценивает твои чувства.", effect: 10, log: "Защита. Ты не обязана слушать это." }, { title: "Объяснить", desc: "Попытаться донести, почему для тебя это важно.", effect: 5, log: "Иногда бесполезно. Люди, которые обесценивают, не хотят слышать." }, { title: "Проанализировать", desc: "«Почему они это делают? Это их проекции?»", effect: 15, log: "Понимание их проекций. Это освобождает от обиды." } ] },
            { text: "Ты чувствуешь, что не можешь расслабиться. Внутри постоянное напряжение, будто ты ждешь подвоха или нападения.", inner: "Расслабление — это навык, а не слабость. Тело нужно учить выходить из режима «бей или беги».", cards: [ { title: "Напрягаться", desc: "Контролировать всё. Быть начеку всегда.", effect: -20, log: "Хронический стресс. Это разрушает иммунитет и психику." }, { title: "Дыхание", desc: "Медленный вдох и выдох. Успокоить нервную систему.", effect: 15, log: "Активация парасимпатики. Тело получает сигнал безопасности." }, { title: "Заземлиться", desc: "Почувствовать тело. Стопы, руки, спину.", effect: 20, log: "Возврат в настоящий момент. Ты здесь и сейчас, в безопасности." }, { title: "Отвлечься", desc: "Посмотреть видео, поиграть.", effect: -10, log: "Иллюзия отдыха. Ты не отдыхаешь, а отключаешься." }, { title: "Прогулка", desc: "Выйти на улицу, сменить обстановку.", effect: 10, log: "Смена обстановки. Физическая активность снижает тревогу." } ] },
            { text: "Ты чувствуешь, что тебя не слышат. Ты говоришь, объясняешь, но люди будто пропускают твои слова мимо ушей.", inner: "Ты имеешь право говорить, даже если не слышат. Твое слово имеет ценность, независимо от реакции других.", cards: [ { title: "Замолчать", desc: "Перестать говорить. Зачем, если не слышат.", effect: -20, log: "Потеря голоса. Ты сдаешься и уходишь в тень." }, { title: "Говорить", desc: "Продолжать отстаивать свою позицию, повторять.", effect: 15, log: "Настойчивость. Ты не сдаешься, ты веришь в себя." }, { title: "Уйти", desc: "Найти тех, кто слышит. Сменить окружение.", effect: 20, log: "Смена окружения. Ты выбираешь среду, где тебя ценят." }, { title: "Злиться", desc: "Наорать на них, чтобы услышали.", effect: -10, log: "Слив энергии. Это не решает проблему." }, { title: "Написать", desc: "Изложить мысли на бумаге или в сообщении.", effect: 10, log: "Выражение. Это способ быть услышанной хотя бы собой." } ] },
{ text: "Ты чувствуешь, что устала от всего. Усталость накопилась и физическая, и эмоциональная. Ничего не хочется.", inner: "Усталость — это сигнал, что пора отдохнуть. Это не слабость. Ты имеешь право на восстановление.", cards: [ { title: "Игнорировать", desc: "Продолжать через силу. Доделать все дела.", effect: -25, log: "Истощение. Ты доводишь себя до предела и падаешь." }, { title: "Отдохнуть", desc: "Разрешить себе паузу. Дать телу и психике восстановиться.", effect: 20, log: "Восстановление. Это забота о себе, а не лень." }, { title: "Пожалеть себя", desc: "Побыть в жалости, поплакать.", effect: -5, log: "Иногда полезно, но недолго. Жалость не дает энергии." }, { title: "Заняться телом", desc: "Сон, еда, вода. База.", effect: 15, log: "База. Восстановление физического ресурса." }, { title: "Поговорить", desc: "С близким человеком. Выговориться.", effect: 10, log: "Поддержка. Иногда нужно просто быть услышанной." } ] },
            { text: "Ты чувствуешь, что не можешь простить себя за прошлые ошибки. Ты прокручиваешь их в голове снова и снова.", inner: "Прошлое нельзя изменить. Но можно перестать тащить его в будущее. Рост — это умение прощать себя и идти дальше.", cards: [ { title: "Карать себя", desc: "Продолжать винить. Ты плохая, ты не заслуживаешь.", effect: -20, log: "Ты тащишь прошлое. Это не дает тебе жить настоящим." }, { title: "Простить", desc: "«Я сделала лучшее, что могла в тех условиях».", effect: 20, log: "Освобождение. Ты принимаешь свой опыт и двигаешься дальше." }, { title: "Оправдывать", desc: "Искать виноватых в других, чтобы не чувствовать вину.", effect: -10, log: "Роль жертвы. Ты снимаешь с себя ответственность, но не решаешь проблему." }, { title: "Анализ", desc: "Извлечь урок и отпустить. Что я поняла?", effect: 15, log: "Мудрость. Ты превращаешь ошибку в опыт." }, { title: "Отвлечься", desc: "Заняться делом, чтобы не думать.", effect: 5, log: "Временное облегчение. Мысль вернется." } ] },
            { text: "Ты чувствуешь, что у тебя нет сил что-то менять. Всё кажется слишком сложным, и ты опускаешь руки.", inner: "Маленькие шаги дают энергию. Бездействие её забирает. Первый шаг разрывает петлю застоя.", cards: [ { title: "Сдаться", desc: "Лечь и ждать, когда всё само пройдет.", effect: -25, log: "Апатия. Ты отдаешь контроль над своей жизнью." }, { title: "Микрошаг", desc: "Сделать 1% действия. Самое маленькое.", effect: 20, log: "Энергия. Действие рождает мотивацию." }, { title: "Пожалеть себя", desc: "Дать себе время, побыть в грусти.", effect: 5, log: "Отдых. Это может помочь, если не затягивать." }, { title: "Сменить фокус", desc: "Переключиться на другое дело.", effect: 15, log: "Ресурс. Ты обходишь блок с другой стороны." }, { title: "Попросить помощь", desc: "Обратиться к другим за поддержкой.", effect: 10, log: "Поддержка. Ты не одна." } ] },
            { text: "Ты чувствуешь, что тебе всё равно. Внутри пустота и безразличие. Ничто не трогает и не радует.", inner: "Равнодушие — это защита от боли. Но жизнь возвращается через чувства. Нужно разбудить себя.", cards: [ { title: "Замереть", desc: "Остаться в апатии. Ничего не чувствовать.", effect: -20, log: "Заморозка. Это защита, но она мешает жить." }, { title: "Разбудить чувства", desc: "Сделать что-то приятное. Обнять, погладить кота, съесть вкусное.", effect: 20, log: "Возврат к жизни. Мозг начинает вырабатывать дофамин." }, { title: "Злиться", desc: "Наорать на себя. Заставить чувствовать.", effect: -10, log: "Самобичевание. Это не пробуждает чувства, а добавляет боль." }, { title: "Проверить тело", desc: "Сделать зарядку, помыться.", effect: 15, log: "Активация. Через тело к эмоциям." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное. Это не решает проблему." } ] },
            { text: "Ты чувствуешь, что не заслуживаешь хорошего. Тебе кажется, что ты недостаточно старалась, недостаточно хороша.", inner: "Ты достойна хорошего просто потому, что ты есть. Ты не должна заслуживать любовь или отдых.", cards: [ { title: "Отказаться", desc: "Не брать хорошее. Я не заслужила.", effect: -25, log: "Самонаказание. Ты лишаешь себя радости." }, { title: "Принять", desc: "«Я заслуживаю хорошего просто так».", effect: 20, log: "Самоценность. Ты позволяешь себе быть счастливой." }, { title: "Найти причину", desc: "Понять, откуда это чувство.", effect: 15, log: "Осознание. Это из детства, это не твоя вина." }, { title: "Доказать", desc: "Пытаться заслужить, делать больше.", effect: -10, log: "Бег по кругу. Ты никогда не докажешь достаточно." }, { title: "Отвлечься", desc: "Пойти погулять, забыть.", effect: 5, log: "Ресурс. Временное облегчение." } ] },
            { text: "Ты чувствуешь, что боишься быть счастливой. Тебе кажется, что за счастьем обязательно придет боль, и ты избегаешь радости.", inner: "Страх счастья — это страх потери. Но отказываясь от радости, ты уже теряешь. Жизнь здесь и сейчас.", cards: [ { title: "Избегать", desc: "Не позволять себе радость, чтобы не было больно потом.", effect: -20, log: "Серость. Ты проживаешь жизнь в черно-белых тонах." }, { title: "Разрешить", desc: "«Я могу быть счастлива. Я заслуживаю этого момента».", effect: 20, log: "Свобода. Ты принимаешь жизнь во всех ее проявлениях." }, { title: "Бояться", desc: "Ожидать подвоха. Не расслабляться.", effect: -15, log: "Тревога. Ты не можешь наслаждаться моментом." }, { title: "Проживать", desc: "Почувствовать момент. Быть здесь и сейчас.", effect: 15, log: "Присутствие. Ты живешь настоящим." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Убегание. Ты снова прячешься от жизни." } ] },
            { text: "Ты чувствуешь, что боишься перемен. Ты хочешь что-то изменить, но страх сковывает и держит на месте.", inner: "Перемены — это выход из зоны комфорта. Страх — это нормально. Но действовать нужно несмотря на страх.", cards: [ { title: "Остаться", desc: "Не менять ничего. Пусть всё будет как есть.", effect: -20, log: "Застой. Ты остаешься в неудовлетворенности." }, { title: "Сделать шаг", desc: "Пойти в страх. Сделать то, чего боишься.", effect: 20, log: "Рост. Ты расширяешь свою жизнь и становишься сильнее." }, { title: "Планировать", desc: "Разбить на шаги. Подготовиться.", effect: 15, log: "Ясность. План снижает страх." }, { title: "Бояться", desc: "Прокручивать худшее.", effect: -15, log: "Паралич. Ты застреваешь в страхе." }, { title: "Обсудить", desc: "С поддержкой, с друзьями.", effect: 10, log: "Опора. Ты не одна в этом." } ] },
            { text: "Ты чувствуешь, что не можешь выстроить границы. Люди нарушают твои границы, а ты не можешь сказать «нет».", inner: "Границы — это не стены, это двери с замком. Ты имеешь право решать, кому открывать.", cards: [ { title: "Терпеть", desc: "Позволять всё. Молчать.", effect: -25, log: "Выгорание. Ты разрушаешь себя, угождая другим." }, { title: "Установить", desc: "Сказать «нет». Четко и спокойно.", effect: 20, log: "Свобода. Ты берешь свою жизнь под контроль." }, { title: "Бояться", desc: "Оставаться удобной, чтобы не потерять отношения.", effect: -15, log: "Страх конфликта. Ты теряешь себя в отношениях." }, { title: "Анализ", desc: "Понять, где нарушают твои границы.", effect: 15, log: "Ясность. Осознание — первый шаг." }, { title: "Практика", desc: "Начать с малого. Сказать «нет» в мелочи.", effect: 10, log: "Навык. Границы — это тренировка." } ] },
            { text: "Ты чувствуешь, что не получаешь удовольствия от жизни. Всё кажется серым и обыденным.", inner: "Удовольствие — это не роскошь, это ресурс. Нужно найти то, что тебя радует, и дать этому место.", cards: [ { title: "Ждать", desc: "Ждать, что само придет. Когда-нибудь.", effect: -20, log: "Пассивность. Ты не создаешь радость." }, { title: "Создавать", desc: "Найти то, что радует. Вспомнить, что ты любила.", effect: 20, log: "Смысл. Ты возвращаешь краски в жизнь." }, { title: "Заесть", desc: "Быстрый дофамин. Еда, сериалы.", effect: -10, log: "Суррогат. Это не настоящее удовольствие." }, { title: "Замедлиться", desc: "Почувствовать момент. Вкус, запах.", effect: 15, log: "Присутствие. Ты возвращаешься в жизнь." }, { title: "Сменить обстановку", desc: "Пойти гулять, сменить место.", effect: 10, log: "Новизна. Это стимулирует интерес." } ] },
            { text: "Ты чувствуешь, что тебе нужно одобрение других. Ты зависишь от чужого мнения и оценки.", inner: "Одобрение извне — это наркотик. Опора внутри — свобода. Ты не обязана никому доказывать свою ценность.", cards: [ { title: "Искать", desc: "Добиваться похвалы, угождать.", effect: -20, log: "Зависимость. Ты теряешь себя в чужом мнении." }, { title: "Дать себе", desc: "Похвалить себя. Признать свои успехи.", effect: 20, log: "Внутренняя опора. Ты становишься на свою сторону." }, { title: "Обесценить", desc: "«Мне всё равно». Защита.", effect: -5, log: "Защита. Это не решает проблему, а прячет ее." }, { title: "Анализ", desc: "«Почему мне это нужно? Чего я боюсь?»", effect: 15, log: "Понимание. Осознание зависимости." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Смена фокуса. Временно." } ] },
            { text: "Ты чувствуешь, что тебе нужно всё контролировать. Ты пытаешься предусмотреть каждый шаг, каждую мелочь, иначе чувствуешь тревогу.", inner: "Отказ от контроля снижает тревогу. Чем больше вы пытаетесь всё держать под контролем, тем сильнее напряжение. Жизнь — это не проект, это поток.", cards: [ { title: "Контроль", desc: "Пытаться всё просчитать. Составить план на каждый день.", effect: -25, log: "Тревога. Ты истощаешься от постоянного напряжения. Контроль — это иллюзия." }, { title: "Отпустить", desc: "Сказать «будь что будет». Позволить жизни течь.", effect: 20, log: "Свобода. Ты снимаешь с себя груз ответственности за всё на свете." }, { title: "Дыхание", desc: "Заземлиться. Почувствовать момент.", effect: 15, log: "Снижение накала. Ты возвращаешься в реальность." }, { title: "Планировать", desc: "Сделать план, но не привязываться к нему.", effect: 5, log: "Иллюзия контроля. План — это ориентир, а не гарантия." }, { title: "Сменить фокус", desc: "Заняться своим телом.", effect: 10, log: "Возврат. Через тело к спокойствию." } ] },
            { text: "Ты чувствуешь, что не можешь расслабиться на людях. Тебе кажется, что все смотрят на тебя и оценивают.", inner: "Люди редко думают о вас. Большинство заняты собой. Твой внутренний критик проецирует страх на окружающих.", cards: [ { title: "Напрягаться", desc: "Быть начеку. Контролировать каждое движение.", effect: -20, log: "Хронический стресс. Ты не можешь быть собой." }, { title: "Принять", desc: "«Они заняты собой. Мне нечего бояться».", effect: 20, log: "Свобода. Ты снимаешь проекцию с других людей." }, { title: "Спрятаться", desc: "Уйти от людей, избегать общения.", effect: -15, log: "Изоляция. Это не решает проблему, а усугубляет ее." }, { title: "Дыхание", desc: "Сделать глубокий вдох и выдох.", effect: 15, log: "Успокоение. Активация парасимпатики." }, { title: "Отвлечься", desc: "Поговорить с кем-то, переключиться.", effect: 10, log: "Смена фокуса. Ты выходишь из головы в реальность." } ] },
            { text: "Ты чувствуешь, что не можешь простить другого человека. Обида держит тебя в прошлом и не дает двигаться дальше.", inner: "Прощение — это не для него, это для тебя. Пока ты держишь обиду, ты продолжаешь жить в той ситуации.", cards: [ { title: "Держать обиду", desc: "Прокручивать ситуацию. Помнить всё.", effect: -25, log: "Ты застряла в прошлом. Обида разрушает тебя, а не его." }, { title: "Простить", desc: "«Я отпускаю это. Это его проблемы, не мои».", effect: 20, log: "Освобождение. Ты возвращаешь себе энергию." }, { title: "Отомстить", desc: "Ответить обидчику.", effect: -15, log: "Ты включаешься в токсичную игру. Это не решает проблему." }, { title: "Анализ", desc: "Понять, почему он так поступил. Увидеть его боль.", effect: 15, log: "Понимание. Это помогает отделить себя от его поступков." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное. Обида вернется." } ] },
            { text: "Ты чувствуешь, что не можешь быть одна. Тебе нужно постоянное общение, иначе ты чувствуешь пустоту и тревогу.", inner: "Умение быть одной — это не изоляция, это самостоятельность. Ты можешь быть с собой в комфорте, не ища спасения в других.", cards: [ { title: "Искать общение", desc: "Звонить всем, писать, лишь бы не быть одной.", effect: -20, log: "Зависимость. Ты теряешь себя в других." }, { title: "Побыть с собой", desc: "Остаться одной. Почувствовать тишину.", effect: 20, log: "Самостоятельность. Ты учишься быть с собой в комфорте." }, { title: "Паниковать", desc: "Чувствовать тревогу и пустоту.", effect: -15, log: "Страх. Ты боишься остаться наедине с собой." }, { title: "Проверить тело", desc: "Почувствовать стопы, дыхание.", effect: 15, log: "Заземление. Ты здесь и сейчас." }, { title: "Заняться делом", desc: "Найти себе занятие.", effect: 10, log: "Отвлечение. Это не решает проблему, но снижает тревогу." } ] },
            { text: "Ты чувствуешь, что не можешь поверить людям. Тебе кажется, что все хотят тебя использовать.", inner: "Доверие — это навык. Он тренируется через опыт безопасных отношений. Ты можешь учиться доверять заново.", cards: [ { title: "Никому не верить", desc: "Закрыться от всех. Быть одной.", effect: -25, log: "Изоляция. Это защита, но она мешает жить." }, { title: "Доверять постепенно", desc: "Начать с малого. Проверять фактами.", effect: 20, log: "Рост. Ты учишься доверять заново." }, { title: "Проверять всех", desc: "Постоянно подозревать.", effect: -15, log: "Тревога. Это истощает." }, { title: "Анализ", desc: "Понять, откуда страх доверия.", effect: 15, log: "Осознание. Это из травмы." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное. Страх вернется." } ] },
            { text: "Ты чувствуешь, что не можешь справиться с эмоциями. Они захлестывают тебя, и ты теряешь контроль.", inner: "Эмоции — это энергия. Им нужен выход. Ты можешь научиться проживать их экологично, не разрушая себя и других.", cards: [ { title: "Подавить", desc: "Спрятать эмоции. Сделать вид, что всё хорошо.", effect: -25, log: "Зажимы в теле. Подавленные эмоции уходят в психосоматику." }, { title: "Прожить", desc: "Позволить себе чувствовать. Поплакать, покричать в подушку.", effect: 20, log: "Свобода. Ты выпускаешь пар и освобождаешься от груза." }, { title: "Выплеснуть на других", desc: "Наорать, обвинить всех.", effect: -15, log: "Разрушение отношений. Это не решает твою проблему." }, { title: "Дыхание", desc: "Дыхание 4-7-8.", effect: 15, log: "Успокоение нервной системы." }, { title: "Написать", desc: "Выписать эмоции на бумагу.", effect: 10, log: "Экологичный выход. Ты структурируешь хаос." } ] },
            { text: "Ты чувствуешь, что не можешь найти свое место в жизни. Тебе кажется, что все вокруг знают, куда идут, а ты нет.", inner: "Смысл — это не точка, а путь. Ты можешь пробовать, ошибаться и находить свое. Это нормально — не знать.", cards: [ { title: "Паниковать", desc: "Сравнивать себя с другими. Думать, что ты неудачница.", effect: -25, log: "Тревога. Это не помогает найти свой путь." }, { title: "Исследовать", desc: "Пробовать новое. Искать, что откликается.", effect: 20, log: "Рост. Ты находишь себя через опыт." }, { title: "Ждать", desc: "Ждать, что само придет.", effect: -15, log: "Пассивность. Ты упускаешь время." }, { title: "Анализ", desc: "Понять, что тебе нравится, а что нет.", effect: 15, log: "Осознание. Ты начинаешь слышать себя." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное. Вопрос вернется." } ] },
            { text: "Ты чувствуешь, что не можешь прекратить самокритику. Внутренний голос постоянно говорит, что ты недостаточно хороша.", inner: "Внутренний критик — это не ты, это голос твоих травм. Ты можешь научиться отвечать ему и заступаться за себя.", cards: [ { title: "Слушать критика", desc: "Соглашаться. Я и правда плохая.", effect: -25, log: "Самоуничтожение. Это путь к депрессии." }, { title: "Заступиться за себя", desc: "«Это не правда. Я имею право быть неидеальной».", effect: 20, log: "Самоценность. Ты становишься на свою сторону." }, { title: "Спорить", desc: "Доказывать критику, что он не прав.", effect: 5, log: "Бесполезно. Критик не слушает логику." }, { title: "Назвать", desc: "«Это мой внутренний критик. Это не факт».", effect: 15, log: "Отделение. Ты выходишь из слияния с ним." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 10, log: "Временное. Критик вернется." } ] },
            { text: "Ты чувствуешь, что не можешь перестать сравнивать себя с другими. Каждый раз, когда видишь чужой успех, ты чувствуешь себя хуже.", inner: "Сравнение — это ловушка. Ты видишь только финал, а не путь. Сравнивай себя только с собой вчерашней.", cards: [ { title: "Сравнивать", desc: "Смотреть на других, чувствовать себя хуже.", effect: -25, log: "Токсичное чувство. Оно разрушает самооценку." }, { title: "Сравнить с собой", desc: "«Я вчерашняя vs я сегодняшняя».", effect: 20, log: "Свой темп. Ты видишь свой прогресс." }, { title: "Обесценить", desc: "«У них все куплено, это фейк».", effect: -10, log: "Защита Эго. Ты не растешь." }, { title: "Вдохновиться", desc: "Увидеть, что возможно. Взять идею.", effect: 15, log: "Мотивация. Ты превращаешь зависть в топливо." }, { title: "Закрыть", desc: "Убрать триггер, выйти из соцсетей.", effect: 10, log: "Меньше шума. Защита психики." } ] },
            { text: "Ты чувствуешь, что не можешь найти баланс между работой и отдыхом. Ты либо работаешь до изнеможения, либо ничего не делаешь.", inner: "Баланс — это навык. Он требует осознанности и границ. Отдых — это не награда, это часть процесса.", cards: [ { title: "Работать до изнеможения", desc: "Пока не упаду. Потом отдохну.", effect: -25, log: "Выгорание. Ты разрушаешь себя." }, { title: "Найти баланс", desc: "Установить режим. Работа — отдых.", effect: 20, log: "Гармония. Ты сохраняешь ресурс." }, { title: "Отдыхать всегда", desc: "Ничего не делать. Лежать.", effect: -15, log: "Апатия. Это не отдых, это застой." }, { title: "Планировать", desc: "Составить расписание. Выделить время на отдых.", effect: 15, log: "Структура. Это помогает." }, { title: "Отвлечься", desc: "Заняться хобби.", effect: 10, log: "Переключение. Это тоже отдых." } ] },
{ text: "Ты чувствуешь, что не можешь перестать думать о человеке. Ты прокручиваешь в голове ваши разговоры, его слова, его поступки, и не можешь остановиться.", inner: "Это не всегда любовь. Иногда это незавершенный сценарий. Мозг зацикливается, потому что нет точки. Ты можешь дать себе эту точку.", cards: [ { title: "Прокручивать", desc: "Думать о нем снова и снова.", effect: -25, log: "Ты застреваешь в прошлом. Это истощает твой ресурс." }, { title: "Завершить", desc: "«Я закрываю эту историю. Она закончена».", effect: 20, log: "Освобождение. Ты ставишь точку и двигаешься дальше." }, { title: "Написать ему", desc: "Попытаться выяснить отношения.", effect: -15, log: "Ты снова втягиваешься в токсичный круг." }, { title: "Анализ", desc: "Понять, что именно тебя держит. Какая потребность не закрыта?", effect: 15, log: "Осознание. Ты понимаешь, что дело не в нем, а в тебе." }, { title: "Отвлечься", desc: "Заняться делом, переключиться.", effect: 10, log: "Временное облегчение. Мысль вернется." } ] },
            { text: "Ты чувствуешь, что не можешь принять свое тело. Тебе кажется, что оно недостаточно красивое, стройное, идеальное.", inner: "Тело — это не картинка, это твой дом. Оно позволяет тебе жить, чувствовать, двигаться. Оно не обязано быть идеальным, чтобы быть достойным любви.", cards: [ { title: "Ненавидеть тело", desc: "Ругать себя, смотреть в зеркало с отвращением.", effect: -25, log: "Саморазрушение. Это путь к расстройству пищевого поведения." }, { title: "Принять", desc: "«Мое тело — мой дом. Я забочусь о нем».", effect: 20, log: "Свобода. Ты начинаешь дружить с телом." }, { title: "Диеты", desc: "Изнурять себя диетами и тренировками.", effect: -15, log: "Истощение. Это не решает проблему, а усугубляет." }, { title: "Заботиться", desc: "Кормить нормально, двигаться в удовольствие, спать.", effect: 15, log: "Здоровье. Тело отвечает благодарностью." }, { title: "Отвлечься", desc: "Заняться делом, забыть о теле.", effect: 5, log: "Временное. Проблема останется." } ] },
            { text: "Ты чувствуешь, что не можешь избавиться от чувства вины. Тебе кажется, что ты виновата во всех проблемах, даже если это не так.", inner: "Чувство вины часто включается не потому что вы виноваты, а потому что вас так приучили. Это не ваш груз.", cards: [ { title: "Карать себя", desc: "Взять всю вину на себя. Я плохая.", effect: -25, log: "Самоуничтожение. Это не решает проблему." }, { title: "Разделить", desc: "«Это не моя вина. Я не несу ответственность за всё».", effect: 20, log: "Освобождение. Ты возвращаешь себе легкость." }, { title: "Оправдываться", desc: "Доказывать всем, что ты не виновата.", effect: -10, log: "Ты тратишь энергию на бесполезные доказательства." }, { title: "Анализ", desc: "Понять, откуда это чувство. Чей это голос?", effect: 15, log: "Осознание. Это из детства." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное. Вина вернется." } ] },
            { text: "Ты чувствуешь, что не можешь перестать тревожиться о будущем. Ты прокручиваешь худшие сценарии и не можешь остановиться.", inner: "Тревога о будущем — это привычка мозга. Мозг не отличает реальное от воображаемого. Ты можешь вернуться в настоящий момент.", cards: [ { title: "Прокручивать", desc: "Думать о худшем. Пытаться всё предусмотреть.", effect: -25, log: "Тревога. Ты проживаешь страх как настоящий." }, { title: "Вернуться в настоящий", desc: "Заземлиться. Почувствовать момент. Дыхание.", effect: 20, log: "Свобода. Ты возвращаешься в реальность." }, { title: "Паниковать", desc: "Позволить тревоге захватить тебя.", effect: -15, log: "Хаос. Ты теряешь контроль." }, { title: "Записать", desc: "Выписать страхи на бумагу.", effect: 15, log: "Структурирование. Ты выносишь их из головы." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 10, log: "Смена фокуса. Тревога снижается." } ] },
            { text: "Ты чувствуешь, что не можешь перестать жалеть себя. Тебе кажется, что ты самая несчастная, и все вокруг виноваты в твоих проблемах.", inner: "Жалость к себе — это ловушка. Она дает временное облегчение, но не дает энергии для изменений. Ты можешь выбрать действие.", cards: [ { title: "Жалеть себя", desc: "Погрузиться в жалость. Плакать.", effect: -20, log: "Застревание. Ты не двигаешься." }, { title: "Действовать", desc: "Сделать маленький шаг к решению проблемы.", effect: 20, log: "Энергия. Действие рождает мотивацию." }, { title: "Обвинять других", desc: "Сказать, что все виноваты.", effect: -15, log: "Роль жертвы. Ты отдаешь ответственность другим." }, { title: "Анализ", desc: "Понять, что ты можешь изменить.", effect: 15, log: "Осознание. Ты возвращаешь себе контроль." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать обвинять других. Тебе кажется, что все вокруг виноваты в твоих проблемах, и ты застреваешь в обиде.", inner: "Обвинение — это защита. Пока ты обвиняешь других, ты не берешь ответственность за свою жизнь. Это путь в никуда.", cards: [ { title: "Обвинять", desc: "Продолжать винить всех.", effect: -25, log: "Ты застреваешь в прошлом. Ты не двигаешься." }, { title: "Взять ответственность", desc: "Понять, что ты можешь изменить.", effect: 20, log: "Свобода. Ты возвращаешь себе контроль." }, { title: "Мстить", desc: "Пытаться наказать обидчиков.", effect: -15, log: "Токсичность. Ты включаешься в чужую игру." }, { title: "Анализ", desc: "Понять, почему они так поступили. Увидеть их боль.", effect: 15, log: "Понимание. Это освобождает." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь справиться с одиночеством. Тебе кажется, что ты одна в этом мире, и никто тебя не понимает.", inner: "Одиночество — это не изоляция, это состояние. Ты можешь быть одна, но не одинокой. Ты можешь стать себе другом.", cards: [ { title: "Бояться одиночества", desc: "Искать общение любой ценой.", effect: -20, log: "Зависимость. Ты теряешь себя в других." }, { title: "Принять", desc: "«Я могу быть одна. Это не приговор».", effect: 20, log: "Свобода. Ты учишься быть с собой." }, { title: "Паниковать", desc: "Чувствовать пустоту и тревогу.", effect: -15, log: "Страх. Ты боишься себя." }, { title: "Проверить тело", desc: "Почувствовать стопы, дыхание.", effect: 15, log: "Заземление. Ты здесь и сейчас." }, { title: "Заняться делом", desc: "Найти себе занятие.", effect: 10, log: "Отвлечение. Временно." } ] },
