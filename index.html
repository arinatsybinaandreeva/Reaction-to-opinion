            { text: "Ты чувствуешь, что не можешь перестать быть удобной для всех. Ты жертвуешь своими интересами ради других, и теряешь себя.", inner: "Ты не обязана быть удобной версией себя. Настоящая ты имеешь право на место. Угождать всем — это путь в никуда.", cards: [ { title: "Угождать", desc: "Продолжать жертвовать собой.", effect: -25, log: "Выгорание. Ты теряешь себя." }, { title: "Отказать", desc: "Сказать «нет». Защитить свои интересы.", effect: 20, log: "Свобода. Ты возвращаешь себе место." }, { title: "Бояться", desc: "Оставаться удобной, чтобы не отвергли.", effect: -15, log: "Страх. Ты теряешь себя." }, { title: "Анализ", desc: "Понять, почему ты угождаешь.", effect: 15, log: "Осознание. Это из детства." }, { title: "Практика", desc: "Начать с малого. Сказать «нет» в мелочи.", effect: 10, log: "Навык. Границы — это тренировка." } ] },
            { text: "Ты чувствуешь, что не можешь перестать контролировать других. Тебе кажется, что если ты не будешь всё контролировать, то всё развалится.", inner: "Ты не можешь контролировать других. Это иллюзия. Ты можешь контролировать только себя и свои реакции.", cards: [ { title: "Контролировать", desc: "Пытаться управлять всем и всеми.", effect: -25, log: "Тревога. Это истощает." }, { title: "Отпустить", desc: "Позволить другим жить своей жизнью.", effect: 20, log: "Свобода. Ты возвращаешь себе энергию." }, { title: "Бояться", desc: "Думать, что всё развалится без тебя.", effect: -15, log: "Страх. Это не решает проблему." }, { title: "Анализ", desc: "Понять, почему ты контролируешь.", effect: 15, log: "Осознание. Это из травмы." }, { title: "Отвлечься", desc: "Заняться собой.", effect: 10, log: "Переключение. Ты возвращаешься к себе." } ] },
            { text: "Ты чувствуешь, что не можешь справиться с потерей. Ты потеряла близкого человека или отношения, и не можешь это отпустить.", inner: "Потеря — это часть жизни. Ты не можешь вернуть прошлое, но можешь научиться жить с этим. Горе нужно прожить, а не подавить.", cards: [ { title: "Отрицать", desc: "Сделать вид, что ничего не случилось.", effect: -25, log: "Застревание. Горе не прожито." }, { title: "Прожить", desc: "Позволить себе горевать. Плакать.", effect: 20, log: "Исцеление. Ты проживаешь боль и отпускаешь." }, { title: "Замереть", desc: "Ничего не чувствовать.", effect: -15, log: "Заморозка. Ты не живешь." }, { title: "Анализ", desc: "Понять, что этот человек дал тебе.", effect: 15, log: "Благодарность. Ты сохраняешь светлую память." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное. Боль вернется." } ] },
            { text: "Ты чувствуешь, что не можешь принять свою внешность. Тебе кажется, что если бы ты выглядела иначе, то была бы счастливее.", inner: "Внешность — это не показатель внутреннего состояния. Красивые люди тоже страдают от одиночества и тревоги. Счастье не зависит от обложки.", cards: [ { title: "Ненавидеть себя", desc: "Ругать себя за внешность. Смотреть в зеркало с отвращением.", effect: -25, log: "Саморазрушение. Это путь к депрессии." }, { title: "Принять", desc: "«Я не идеальна, и это нормально. Я ценна не только внешностью».", effect: 20, log: "Свобода. Ты перестаешь быть заложником картинки." }, { title: "Изменить", desc: "Пытаться изменить внешность любой ценой.", effect: -15, log: "Погоня за иллюзией. Это не приносит счастья." }, { title: "Заботиться", desc: "Ухаживать за собой в удовольствие, а не в наказание.", effect: 15, log: "Здоровье. Ты дружишь с собой." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное. Проблема останется." } ] },
            { text: "Ты чувствуешь, что не можешь справиться с критикой. Любое замечание в твой адрес вызывает бурю эмоций и желание защищаться.", inner: "Критика — это информация. Но не вся критика полезна. Чужая критика часто говорит о них, а не о вас. Ты можешь фильтровать.", cards: [ { title: "Защищаться", desc: "Агрессивно отвечать на критику.", effect: -20, log: "Скандал. Ты тратишь энергию." }, { title: "Анализировать", desc: "«Это правда про меня? Или это их проекция?»", effect: 20, log: "Мудрость. Ты отделяешь факты от мнений." }, { title: "Принимать всё", desc: "Соглашаться с любой критикой.", effect: -25, log: "Самоуничтожение. Ты разрушаешь самооценку." }, { title: "Игнорировать", desc: "Не реагировать, если критика токсична.", effect: 15, log: "Защита. Ты сохраняешь ресурс." }, { title: "Спросить", desc: "«Что именно ты имеешь в виду?»", effect: 10, log: "Диалог. Ты проясняешь ситуацию." } ] },
            { text: "Ты чувствуешь, что не можешь перестать заедать стресс. Еда стала твоим способом справляться с эмоциями.", inner: "Еда — это не решение проблемы, это суррогат. Ты можешь найти другие способы справляться с эмоциями, не разрушая тело.", cards: [ { title: "Заедать", desc: "Продолжать заедать стресс.", effect: -25, log: "Порочный круг. Вина и новая порция еды." }, { title: "Найти замену", desc: "Прогулка, дыхание, творчество, общение.", effect: 20, log: "Здоровье. Ты находишь экологичный выход." }, { title: "Ругать себя", desc: "Ненавидеть себя за слабость.", effect: -15, log: "Самобичевание. Это не помогает." }, { title: "Анализ", desc: "Понять, какие эмоции ты заедаешь.", effect: 15, log: "Осознание. Ты видишь причину." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать прокрастинировать. Ты откладываешь важные дела, даже когда понимаешь, что это вредит тебе.", inner: "Прокрастинация — это не лень, это избегание дискомфорта. Мозг боится, что не получится идеально, и выбирает знакомое бездействие.", cards: [ { title: "Прокрастинировать", desc: "Откладывать дальше.", effect: -25, log: "Тревога и вина. Ты застреваешь." }, { title: "Снизить планку", desc: "«Сделаю плохо, но сделаю». Начать с 5 минут.", effect: 20, log: "Действие. Петля застоя разорвана." }, { title: "Ругать себя", desc: "Какой же я безвольный кусок.", effect: -15, log: "Самокритика снижает мотивацию." }, { title: "Разбить на шаги", desc: "Открыть документ и написать одно предложение.", effect: 15, log: "Энергия. Маленькие победы дают дофамин." }, { title: "Пообещать награду", desc: "Сделаю дело, а потом вкусняшку.", effect: 10, log: "Дофамин. Работает." } ] },
            { text: "Ты чувствуешь, что не можешь избавиться от чувства стыда. Тебе кажется, что ты какая-то не такая, и это вызывает жгучий стыд.", inner: "Стыд — это токсичная эмоция, которая говорит, что ты плохая. Это не так. Стыд — это про то, что с тобой что-то не так. Это ложь.", cards: [ { title: "Стыдиться", desc: "Прятаться от всех. Чувствовать себя ничтожеством.", effect: -25, log: "Изоляция. Стыд разрушает." }, { title: "Принять", desc: "«Я имею право быть собой. Я не обязана быть идеальной».", effect: 20, log: "Свобода. Ты перестаешь быть заложником стыда." }, { title: "Осуждать себя", desc: "Ругать себя за то, что ты такая.", effect: -15, log: "Самоуничтожение." }, { title: "Анализ", desc: "Понять, откуда этот стыд. Чей это голос?", effect: 15, log: "Осознание. Это из детства." }, { title: "Поговорить", desc: "С тем, кто принимает тебя.", effect: 10, log: "Поддержка. Ты не одна." } ] },
            { text: "Ты чувствуешь, что не можешь перестать завидовать. Ты видишь чужой успех и чувствуешь укол зависти.", inner: "Зависть — это сигнал о твоих собственных желаниях. Ты можешь превратить ее в топливо для роста, а не в разрушение.", cards: [ { title: "Завидовать", desc: "Разрушаться от зависти.", effect: -25, log: "Токсичное чувство." }, { title: "Вдохновиться", desc: "Увидеть, что возможно. Взять идею.", effect: 20, log: "Мотивация. Ты превращаешь зависть в топливо." }, { title: "Обесценить", desc: "«У них все куплено».", effect: -15, log: "Защита Эго. Ты не растешь." }, { title: "Анализ", desc: "Понять, чего именно ты хочешь.", effect: 15, log: "Осознание. Ты слышишь свои желания." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 10, log: "Смена фокуса." } ] },
            { text: "Ты чувствуешь, что не можешь перестать винить себя за прошлое. Ты прокручиваешь ошибки и не можешь простить себя.", inner: "Прошлое нельзя изменить. Но можно перестать тащить его в будущее. Рост — это умение прощать себя и идти дальше.", cards: [ { title: "Карать себя", desc: "Продолжать винить. Ты плохая.", effect: -25, log: "Ты тащишь прошлое." }, { title: "Простить", desc: "«Я сделала лучшее, что могла в тех условиях».", effect: 20, log: "Освобождение." }, { title: "Оправдывать", desc: "Искать виноватых.", effect: -15, log: "Роль жертвы." }, { title: "Анализ", desc: "Извлечь урок и отпустить.", effect: 15, log: "Мудрость." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться будущего. Ты прокручиваешь худшие сценарии и не можешь остановиться.", inner: "Тревога о будущем — это привычка мозга. Мозг не отличает реальное от воображаемого. Ты можешь вернуться в настоящий момент.", cards: [ { title: "Прокручивать", desc: "Думать о худшем.", effect: -25, log: "Тревога." }, { title: "Вернуться в настоящий", desc: "Заземлиться. Дыхание.", effect: 20, log: "Свобода." }, { title: "Паниковать", desc: "Позволить тревоге захватить тебя.", effect: -15, log: "Хаос." }, { title: "Записать", desc: "Выписать страхи на бумагу.", effect: 15, log: "Структурирование." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 10, log: "Смена фокуса." } ] },
            { text: "Ты чувствуешь, что не можешь перестать контролировать свою жизнь. Ты пытаешься всё предусмотреть, и это вызывает тревогу.", inner: "Отказ от контроля снижает тревогу. Чем больше вы пытаетесь всё держать под контролем, тем сильнее напряжение. Жизнь — это поток.", cards: [ { title: "Контроль", desc: "Пытаться всё просчитать.", effect: -25, log: "Тревога." }, { title: "Отпустить", desc: "«Будь что будет».", effect: 20, log: "Свобода." }, { title: "Дыхание", desc: "Заземлиться.", effect: 15, log: "Снижение накала." }, { title: "Планировать", desc: "Сделать план, но не привязываться.", effect: 5, log: "Иллюзия контроля." }, { title: "Сменить фокус", desc: "Заняться телом.", effect: 10, log: "Возврат." } ] },
            { text: "Ты чувствуешь, что не можешь перестать ждать одобрения от других. Ты зависишь от чужого мнения и оценки.", inner: "Одобрение извне — это наркотик. Опора внутри — свобода. Ты не обязана никому доказывать свою ценность.", cards: [ { title: "Искать одобрение", desc: "Добиваться похвалы.", effect: -25, log: "Зависимость." }, { title: "Дать себе", desc: "Похвалить себя.", effect: 20, log: "Внутренняя опора." }, { title: "Обесценить", desc: "«Мне всё равно».", effect: -10, log: "Защита." }, { title: "Анализ", desc: "«Почему мне это нужно?»", effect: 15, log: "Понимание." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 10, log: "Смена фокуса." } ] },
            { text: "Ты чувствуешь, что не можешь перестать винить себя за то, что не идеальна. Ты требуешь от себя совершенства во всем.", inner: "Перфекционизм — это не стремление к лучшему, это страх быть отвергнутой. Ты имеешь право быть неидеальной и ошибаться.", cards: [ { title: "Требовать идеала", desc: "Ругать себя за малейшую ошибку.", effect: -25, log: "Самоуничтожение. Ты никогда не будешь достаточно хороша." }, { title: "Принять неидеальность", desc: "«Я человек, я могу ошибаться».", effect: 20, log: "Свобода. Ты снимаешь груз идеальности." }, { title: "Откладывать", desc: "Не начинать, пока не буду готова.", effect: -15, log: "Прокрастинация. Ты упускаешь жизнь." }, { title: "Анализ", desc: "Понять, откуда этот перфекционизм. Чей это голос?", effect: 15, log: "Осознание. Это из детства." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 10, log: "Временное." } ] },
{ text: "Ты чувствуешь, что не можешь перестать искать виноватых. Тебе кажется, что все вокруг виноваты в твоих проблемах.", inner: "Обвинение — это защита. Пока ты обвиняешь других, ты не берешь ответственность за свою жизнь. Это путь в никуда.", cards: [ { title: "Обвинять", desc: "Продолжать винить всех.", effect: -25, log: "Ты застреваешь в прошлом." }, { title: "Взять ответственность", desc: "Понять, что ты можешь изменить.", effect: 20, log: "Свобода. Ты возвращаешь себе контроль." }, { title: "Мстить", desc: "Пытаться наказать обидчиков.", effect: -15, log: "Токсичность." }, { title: "Анализ", desc: "Понять, почему они так поступили.", effect: 15, log: "Понимание." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 10, log: "Смена фокуса." } ] },
            { text: "Ты чувствуешь, что не можешь перестать быть сильной. Ты не позволяешь себе слабость, потому что боишься, что тебя сломают.", inner: "Сила — это не отсутствие слабости. Это умение признавать ее и просить помощь. Уязвимость — это тоже сила.", cards: [ { title: "Быть сильной", desc: "Не показывать эмоции. Держать всё в себе.", effect: -25, log: "Истощение. Ты разрушаешь себя изнутри." }, { title: "Признать слабость", desc: "«Мне больно. Мне нужна помощь».", effect: 20, log: "Свобода. Ты становишься живой." }, { title: "Скрывать", desc: "Делать вид, что всё хорошо.", effect: -15, log: "Одиночество. Ты остаешься одна со своей болью." }, { title: "Анализ", desc: "Понять, откуда этот страх слабости.", effect: 15, log: "Осознание. Это из травмы." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться одиночества. Тебе кажется, что остаться одной — это самое страшное, что может случиться.", inner: "Одиночество — это не изоляция, это состояние. Ты можешь быть одна, но не одинокой. Ты можешь стать себе другом.", cards: [ { title: "Бояться одиночества", desc: "Искать общение любой ценой.", effect: -25, log: "Зависимость. Ты теряешь себя." }, { title: "Принять", desc: "«Я могу быть одна. Это не приговор».", effect: 20, log: "Свобода. Ты учишься быть с собой." }, { title: "Паниковать", desc: "Чувствовать пустоту и тревогу.", effect: -15, log: "Страх. Ты боишься себя." }, { title: "Проверить тело", desc: "Почувствовать стопы, дыхание.", effect: 15, log: "Заземление." }, { title: "Заняться делом", desc: "Найти себе занятие.", effect: 10, log: "Отвлечение." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться конфликтов. Ты избегаешь любых споров и стычек, даже если твои границы нарушают.", inner: "Конфликт — это не всегда плохо. Иногда это единственный способ защитить свои границы. Здоровый конфликт — это прояснение.", cards: [ { title: "Избегать", desc: "Молчать и терпеть.", effect: -25, log: "Выгорание. Ты теряешь себя." }, { title: "Защитить границы", desc: "Спокойно сказать, что тебе не нравится.", effect: 20, log: "Свобода. Ты защищаешь себя." }, { title: "Агрессия", desc: "Наорать в ответ.", effect: -15, log: "Скандал. Ты теряешь контроль." }, { title: "Анализ", desc: "Понять, почему ты боишься конфликтов.", effect: 15, log: "Осознание. Это из детства." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться быть отвергнутой. Тебе кажется, что если тебя отвергнут, то это конец.", inner: "Отвержение — это не конец света. Это опыт. Ты не обязана нравиться всем. Твоя ценность не зависит от чужого выбора.", cards: [ { title: "Бояться", desc: "Угождать всем, чтобы не отвергли.", effect: -25, log: "Потеря себя. Ты живешь чужой жизнью." }, { title: "Принять", desc: "«Я не обязана нравиться всем».", effect: 20, log: "Свобода. Ты принимаешь себя." }, { title: "Паниковать", desc: "Бояться любого осуждения.", effect: -15, log: "Тревога." }, { title: "Анализ", desc: "Понять, откуда этот страх. Чей это голос?", effect: 15, log: "Осознание. Это из детства." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться неудачи. Тебе кажется, что если ты ошибешься, то ты неудачница.", inner: "Ошибка — это опыт, а не приговор. Психика не растет на идеальности, она растет на пробах и промахах. Рост начинается с движения.", cards: [ { title: "Бояться ошибки", desc: "Не делать ничего, чтобы не ошибиться.", effect: -25, log: "Прокрастинация. Ты упускаешь жизнь." }, { title: "Разрешить ошибку", desc: "«Я могу ошибаться. Это часть пути».", effect: 20, log: "Свобода. Ты начинаешь действовать." }, { title: "Откладывать", desc: "Ждать идеального момента.", effect: -15, log: "Паралич." }, { title: "Анализ", desc: "«Что я узнаю из этого опыта?»", effect: 15, log: "Рост. Ты фокусируешься на процессе." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться быть счастливой. Тебе кажется, что за счастьем обязательно придет боль, и ты избегаешь радости.", inner: "Страх счастья — это страх потери. Но отказываясь от радости, ты уже теряешь. Жизнь здесь и сейчас. Ты имеешь право на счастье.", cards: [ { title: "Избегать", desc: "Не позволять себе радость, чтобы не было больно потом.", effect: -25, log: "Серость. Ты проживаешь жизнь в черно-белых тонах." }, { title: "Разрешить", desc: "«Я могу быть счастлива. Я заслуживаю этого момента».", effect: 20, log: "Свобода. Ты принимаешь жизнь." }, { title: "Бояться", desc: "Ожидать подвоха. Не расслабляться.", effect: -15, log: "Тревога." }, { title: "Проживать", desc: "Почувствовать момент. Быть здесь и сейчас.", effect: 15, log: "Присутствие." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Убегание." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться неизвестности. Тебе кажется, что если ты не знаешь, что будет, то это катастрофа.", inner: "Неопределенность — это не враг. Это пространство, в котором ты живешь. Умение быть в ней без паники — признак зрелости.", cards: [ { title: "Бояться", desc: "Пытаться всё контролировать.", effect: -25, log: "Тревога. Это истощает." }, { title: "Принять", desc: "«Я не обязана знать всё заранее».", effect: 20, log: "Свобода. Ты возвращаешь себе спокойствие." }, { title: "Паниковать", desc: "Прокручивать худшие сценарии.", effect: -15, log: "Страх." }, { title: "Опора", desc: "Сфокусироваться на том, что контролируешь.", effect: 15, log: "Возврат силы." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать искать смысл жизни. Тебе кажется, что без великой цели твое существование бессмысленно.", inner: "Смысл — это не точка, а путь. Ты можешь находить смысл в маленьких делах, в заботе, в творчестве. Жизнь не обязана быть великой, чтобы быть ценной.", cards: [ { title: "Искать великий смысл", desc: "Страдать от того, что не нашел его.", effect: -25, log: "Экзистенциальный кризис. Ты упускаешь жизнь." }, { title: "Создавать смысл", desc: "Находить радость в простых вещах.", effect: 20, log: "Смысл. Ты начинаешь жить." }, { title: "Сдаться", desc: "«Всё бессмысленно».", effect: -15, log: "Апатия." }, { title: "Помочь другому", desc: "Найти смысл в заботе о ком-то.", effect: 15, log: "Связь. Ты выходишь из себя." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь справиться с чувством пустоты. Внутри как будто дыра, которую невозможно заполнить ничем.", inner: "Пустота — это сигнал, что ты давно не жила своей жизнью. Это не всегда депрессия. Иногда это призыв вернуться к себе.", cards: [ { title: "Заполнять суррогатами", desc: "Еда, сериалы, шопинг, чтобы заглушить пустоту.", effect: -25, log: "Временное облегчение. Пустота вернется с новой силой." }, { title: "Вернуться к базе", desc: "Сон, еда, вода, тишина. Наладить физическое состояние.", effect: 20, log: "Восстановление. Психике нужно время." }, { title: "Игнорировать", desc: "Делать вид, что всё нормально.", effect: -15, log: "Разрушение. Пустота никуда не уйдет." }, { title: "Создавать", desc: "Начать делать что-то своими руками.", effect: 15, log: "Смысл. Ты возвращаешься к жизни." }, { title: "Помочь другому", desc: "Найти того, кому хуже, и помочь.", effect: 10, log: "Связь. Это выводит из эгоцентризма." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться старости. Тебе кажется, что с возрастом ты станешь никому не нужной.", inner: "Старость — это не конец, это этап. Ценность человека не зависит от возраста. Мудрость и опыт — это тоже ресурс.", cards: [ { title: "Бояться", desc: "Пытаться выглядеть моложе любой ценой.", effect: -25, log: "Тревога. Ты не живешь настоящим." }, { title: "Принять", desc: "«Я старею, и это нормально. Я ценна в любом возрасте».", effect: 20, log: "Свобода. Ты принимаешь свой путь." }, { title: "Обесценить", desc: "«Молодость — это всё, а старость — это ужас».", effect: -15, log: "Страх. Ты закрываешь глаза на реальность." }, { title: "Развиваться", desc: "Продолжать учиться и расти.", effect: 15, log: "Рост. Ты остаешься интересной себе и другим." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться смерти. Тебе кажется, что жизнь конечна, и это лишает ее смысла.", inner: "Конечность жизни — это то, что придает ей ценность. Ты не можешь изменить то, что жизнь конечна, но можешь выбрать, как ее прожить.", cards: [ { title: "Бояться", desc: "Прокручивать мысли о смерти.", effect: -25, log: "Тревога. Ты не живешь." }, { title: "Принять", desc: "«Жизнь конечна, и это делает ее ценной».", effect: 20, log: "Свобода. Ты начинаешь ценить каждый момент." }, { title: "Игнорировать", desc: "Не думать об этом вообще.", effect: -15, log: "Страх вернется." }, { title: "Жить сейчас", desc: "Сделать что-то важное сегодня.", effect: 15, log: "Смысл. Ты проживаешь жизнь." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 10, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться предательства. Тебе кажется, что все люди в итоге предадут тебя.", inner: "Страх предательства — это защита от боли. Но он мешает тебе строить близкие отношения. Ты можешь учиться доверять постепенно.", cards: [ { title: "Не доверять никому", desc: "Закрыться от всех.", effect: -25, log: "Изоляция. Ты остаешься одна." }, { title: "Доверять постепенно", desc: "Начать с малого. Проверять фактами.", effect: 20, log: "Рост. Ты учишься доверять заново." }, { title: "Подозревать", desc: "Проверять всех.", effect: -15, log: "Тревога. Это истощает." }, { title: "Анализ", desc: "Понять, откуда этот страх.", effect: 15, log: "Осознание. Это из травмы." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться одиночества в старости. Тебе кажется, что ты останешься одна и никому не будешь нужна.", inner: "Будущее не предопределено. Ты можешь строить связи сейчас, чтобы не остаться одной потом. Но и одна — ты не обязательно будешь несчастна.", cards: [ { title: "Бояться", desc: "Прокручивать худшие сценарии.", effect: -25, log: "Тревога." }, { title: "Строить связи", desc: "Заботиться о близких сейчас.", effect: 20, log: "Связи. Ты создаешь поддержку." }, { title: "Замыкаться", desc: "Отталкивать людей.", effect: -15, log: "Изоляция." }, { title: "Принять", desc: "«Я могу быть одна. Это не приговор».", effect: 15, log: "Свобода. Ты не боишься себя." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться неопределенности. Тебе кажется, что если ты не знаешь, что будет, то это катастрофа.", inner: "Неопределенность — это не враг. Это пространство, в котором ты живешь. Умение быть в ней без паники — признак зрелости.", cards: [ { title: "Бояться", desc: "Пытаться всё контролировать.", effect: -25, log: "Тревога." }, { title: "Принять", desc: "«Я не обязана знать всё заранее».", effect: 20, log: "Свобода." }, { title: "Паниковать", desc: "Прокручивать худшее.", effect: -15, log: "Страх." }, { title: "Опора", desc: "Сфокусироваться на том, что контролируешь.", effect: 15, log: "Возврат силы." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться, что тебя не поймут. Тебе кажется, что если ты выразишь свои чувства, то тебя отвергнут.", inner: "Быть понятой — это не обязанность. Ты имеешь право на свои чувства, даже если их не понимают. Ты не обязана быть удобной.", cards: [ { title: "Молчать", desc: "Скрывать свои чувства.", effect: -25, log: "Потеря голоса." }, { title: "Выразить", desc: "Сказать о своих чувствах, даже если не поймут.", effect: 20, log: "Свобода. Ты остаешься собой." }, { title: "Оправдываться", desc: "Объяснять, почему ты так чувствуешь.", effect: -10, log: "Ты тратишь энергию зря." }, { title: "Найти тех, кто поймет", desc: "Сменить окружение.", effect: 15, log: "Поддержка." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться, что тебя не примут. Тебе кажется, что ты недостаточно хороша, чтобы быть принятой.", inner: "Принятие начинается с себя. Ты не можешь заставить других принять тебя, но можешь принять себя сама. Ты достойна принятия просто так.", cards: [ { title: "Стараться понравиться", desc: "Угождать всем.", effect: -25, log: "Потеря себя." }, { title: "Принять себя", desc: "«Я принимаю себя такой, какая я есть».", effect: 20, log: "Свобода. Ты становишься на свою сторону." }, { title: "Обесценить", desc: "«Мне всё равно на других».", effect: -15, log: "Защита. Это не решает проблему." }, { title: "Анализ", desc: "Понять, откуда этот страх.", effect: 15, log: "Осознание. Это из детства." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться, что тебя предадут. Тебе кажется, что все люди в итоге предадут тебя.", inner: "Страх предательства — это защита от боли. Но он мешает тебе строить близкие отношения. Ты можешь учиться доверять постепенно.", cards: [ { title: "Не доверять никому", desc: "Закрыться от всех.", effect: -25, log: "Изоляция." }, { title: "Доверять постепенно", desc: "Начать с малого.", effect: 20, log: "Рост." }, { title: "Подозревать", desc: "Проверять всех.", effect: -15, log: "Тревога." }, { title: "Анализ", desc: "Понять, откуда страх.", effect: 15, log: "Осознание." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться, что ты не справишься. Тебе кажется, что любая трудность тебя сломает.", inner: "Ты справлялась раньше — справишься и сейчас. Ты сильнее, чем думаешь. Трудности — это часть жизни, а не конец.", cards: [ { title: "Бояться", desc: "Прокручивать худшее.", effect: -25, log: "Паралич." }, { title: "Опора", desc: "«Я справлялась раньше — справлюсь и сейчас».", effect: 20, log: "Сила. Ты возвращаешь себе веру." }, { title: "Паниковать", desc: "Ожидать провала.", effect: -15, log: "Страх." }, { title: "Разбить на шаги", desc: "Сделать маленький шаг.", effect: 15, log: "Действие. Ты начинаешь." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
{ text: "Ты чувствуешь, что твоя жизнь превратилась в «День сурка». Каждый день одно и то же: работа, дом, телефон. Ты устала от этой серости и рутины.", inner: "Это не депрессия. Это застой. Мозгу нужна новизна для выработки дофамина. Новое — это естественная пища для мозга. Счастье — это не точка, а процесс движения.", cards: [ { title: "Терпеть рутину", desc: "Продолжать жить на автопилоте. Так безопаснее.", effect: -25, log: "Деградация. Ты медленно умираешь от скуки. Мозг перестает развиваться." }, { title: "Внести новизну", desc: "Поменять маршрут, попробовать новое блюдо, найти хобби.", effect: 20, log: "Энергия. Мозг получает дофамин. Жизнь снова начинает играть красками." }, { title: "Ждать чуда", desc: "Сидеть и ждать, что всё само изменится.", effect: -15, log: "Пассивность. Чуда не случится. Ты упускаешь время." }, { title: "Обесценить", desc: "«Всё бессмысленно, жизнь — боль».", effect: -10, log: "Защита Эго. Ты закрываешься от жизни, но не решаешь проблему." }, { title: "Исследовать", desc: "Начать задавать вопросы: «А что если...?»", effect: 15, log: "Любопытство. Это первый шаг к изменениям." } ] },
            { text: "Ты чувствуешь, что тебя тянет к людям, которые тебя не ценят. Ты знаешь, что они токсичны, но их внимание для тебя как наркотик.", inner: "Это травматическая связь. Мозг привык к качелям «тепло-холод». Если в детстве была драма, то во взрослом возрасте тишина и покой кажутся опасными. Это не любовь, это зависимость.", cards: [ { title: "Идти на поводу", desc: "Снова писать ему, искать внимания.", effect: -30, log: "Ты разрушаешь себя. Это порочный круг, из которого нужно выходить." }, { title: "Разорвать связь", desc: "Признать зависимость и прекратить общение.", effect: 20, log: "Свобода. Это больно, но это путь к здоровой жизни." }, { title: "Терпеть", desc: "Ждать, что он изменится.", effect: -20, log: "Иллюзия. Люди не меняются по щелчку." }, { title: "Проанализировать", desc: "Понять, какую потребность ты закрываешь этой болью.", effect: 15, log: "Осознание. Ты видишь корень проблемы." }, { title: "Переключиться", desc: "Заняться собой, чтобы отвлечься.", effect: 10, log: "Временное облегчение." } ] },
            { text: "Ты чувствуешь, что боишься проявляться. Ты хочешь петь, танцевать, рисовать или говорить, но страх осуждения сковывает тебя.", inner: "Страх осуждения — это страх быть отвергнутой. Но, прячась, ты уже отвергаешь себя. Твое проявление — это твой дар миру. Никто не сделает это так, как ты.", cards: [ { title: "Спрятаться", desc: "Молчать и не высовываться.", effect: -25, log: "Потеря себя. Ты живешь чужую жизнь, боясь чужого мнения." }, { title: "Проявиться", desc: "Сделать это, несмотря на страх.", effect: 20, log: "Свобода. Ты выходишь из зоны комфорта. Это самый быстрый путь к росту." }, { title: "Оправдываться", desc: "Объяснять всем, почему ты это делаешь.", effect: -10, log: "Ты тратишь энергию на доказательства." }, { title: "Начать с малого", desc: "Петь в душе, рисовать для себя.", effect: 15, log: "Безопасное проявление. Ты тренируешь мышцу смелости." }, { title: "Найти своих", desc: "Найти тех, кто поддержит твое творчество.", effect: 10, log: "Поддержка. Ты не одна." } ] },
            { text: "Ты чувствуешь, что все вокруг говорят тебе, как надо жить. Родители, друзья, соцсети — у всех есть мнение о твоей жизни.", inner: "Чужое мнение — это не истина о тебе. Это их проекции, их страхи и их опыт. Ты не обязана жить по чужому сценарию. Ты — автор своей жизни.", cards: [ { title: "Слушать всех", desc: "Пытаться соответствовать всем ожиданиям.", effect: -30, log: "Ты теряешь себя в чужих желаниях. Это путь к неврозу." }, { title: "Установить границы", desc: "«Спасибо за мнение, но я решу сам(а)».", effect: 20, log: "Свобода. Ты защищаешь свою территорию и свою реальность." }, { title: "Спорить", desc: "Доказывать, что они не правы.", effect: -15, log: "Скандал. Ты тратишь энергию впустую." }, { title: "Игнорировать", desc: "Пропускать мимо ушей, кивать и делать по-своему.", effect: 15, log: "Мудрость. Ты не вовлекаешься в чужую игру." }, { title: "Сменить окружение", desc: "Найти тех, кто уважает твой выбор.", effect: 10, log: "Свобода. Ты выбираешь среду, которая тебя поддерживает." } ] },
            { text: "Ты чувствуешь, что устала от постоянного напряжения. Ты не можешь расслабиться, даже когда отдыхаешь. Внутри постоянная тревога.", inner: "Это хронический стресс. Твой мозг застрял в режиме «бей или беги». Тебе нужно активировать парасимпатическую систему и вернуться в реальность.", cards: [ { title: "Продолжать", desc: "Игнорировать сигналы тела.", effect: -25, log: "Истощение. Это путь к срыву и болезням." }, { title: "Дыхание", desc: "Сделать дыхание 4-7-8, заземлиться.", effect: 20, log: "Успокоение. Активация парасимпатики. Ты возвращаешься в момент." }, { title: "Паниковать", desc: "Думать, что это никогда не кончится.", effect: -15, log: "Усиление тревоги." }, { title: "Сменить фокус", desc: "Выйти на прогулку, заняться спортом.", effect: 15, log: "Сброс напряжения через тело." }, { title: "Пожалеть себя", desc: "Побыть в жалости к себе.", effect: -5, log: "Временное облегчение." } ] },
            { text: "Ты чувствуешь, что твои отношения разрушаются. Ты и партнер отдаляетесь друг от друга, но ты боишься остаться одна.", inner: "Страх одиночества — это плохой фундамент для отношений. Если вы вместе только из-за страха, это не любовь. Это зависимость. Ты достойна настоящей близости.", cards: [ { title: "Цепляться", desc: "Делать вид, что всё хорошо, лишь бы не быть одной.", effect: -30, log: "Ты теряешь себя в иллюзии. Отношения становятся токсичными." }, { title: "Отпустить", desc: "Признать, что отношения изжили себя, и дать себе свободу.", effect: 20, log: "Свобода. Это страшно, но это честно. Ты выбираешь себя." }, { title: "Обвинять его", desc: "Сказать, что это он во всем виноват.", effect: -15, log: "Роль жертвы. Ты не берешь ответственность." }, { title: "Обсудить", desc: "Попытаться наладить контакт и понять друг друга.", effect: 15, log: "Диалог. Это шанс на исцеление." }, { title: "Отвлечься", desc: "Уйти в работу или хобби.", effect: 5, log: "Временное. Проблема останется." } ] },
            { text: "Ты чувствуешь, что не можешь простить себя за то, что когда-то причинила боль другому человеку. Ты мучаешься чувством вины.", inner: "Прошлое нельзя изменить. Но можно перестать тащить его в будущее. Вина — это полезно только тогда, когда она ведет к действию. Если ты искренне жалеешь, ты уже изменилась.", cards: [ { title: "Карать себя", desc: "Продолжать мучиться виной.", effect: -25, log: "Саморазрушение. Это не приносит пользы никому." }, { title: "Простить", desc: "«Я сделала ошибку. Я учусь. Я прощаю себя».", effect: 20, log: "Освобождение. Ты принимаешь свой опыт и двигаешься дальше." }, { title: "Оправдываться", desc: "Искать причины, почему ты так поступила.", effect: -10, log: "Защита Эго. Это не помогает исцелиться." }, { title: "Извлечь урок", desc: "Понять, что ты сделаешь иначе в будущем.", effect: 15, log: "Мудрость. Ты превращаешь боль в рост." }, { title: "Заняться делом", desc: "Переключиться на новые задачи.", effect: 5, log: "Временное облегчение." } ] },
            { text: "Ты чувствуешь, что постоянно ищешь одобрения в соцсетях. Ты выкладываешь фото и ждешь лайков, чтобы почувствовать себя значимой.", inner: "Лайки — это быстрый дофамин. Это не любовь и не принятие. Твоя ценность не измеряется количеством лайков. Ты не товар, чтобы тебя оценивали.", cards: [ { title: "Искать лайки", desc: "Выкладывать всё больше, чтобы получить реакцию.", effect: -25, log: "Зависимость. Ты теряешь себя в чужом одобрении." }, { title: "Отписаться", desc: "Удалить соцсети на время и вернуться к себе.", effect: 20, log: "Свобода. Ты возвращаешь себе контроль над своей жизнью." }, { title: "Обесценить", desc: "«Да кому это надо, эти лайки».", effect: -10, log: "Защита Эго. Проблема осталась внутри." }, { title: "Понять", desc: "Чего ты на самом деле хочешь? Внимания? Любви?", effect: 15, log: "Осознание. Ты видишь истинную потребность." }, { title: "Заняться собой", desc: "Переключиться на реальную жизнь.", effect: 10, log: "Возврат к реальности." } ] },
            { text: "Ты чувствуешь, что боишься начинать что-то новое. Тебе кажется, что у тебя не получится, и ты даже не пробуешь.", inner: "Страх ошибки — это страх быть отвергнутой. Но если ты не пробуешь, ты уже потерпела поражение. Ошибка — это опыт, а не приговор.", cards: [ { title: "Бояться", desc: "Оставаться на месте.", effect: -25, log: "Застой. Ты упускаешь возможности." }, { title: "Сделать шаг", desc: "Начать с малого, даже если страшно.", effect: 20, log: "Рост. Ты преодолеваешь страх и становишься сильнее." }, { title: "Ждать", desc: "Ждать, когда станет не страшно.", effect: -15, log: "Страх никогда не исчезнет полностью. Нужно действовать." }, { title: "Анализ", desc: "«Что худшее может случиться?»", effect: 15, log: "Осознание. Страх преувеличен." }, { title: "Попросить помощь", desc: "Найти поддержку.", effect: 10, log: "Ты не одна." } ] },
            { text: "Ты чувствуешь, что в твоей жизни нет места для радости. Ты все время занята выживанием, работой и решением проблем.", inner: "Радость — это не роскошь, это ресурс. Без нее психика истощается. Ты имеешь право на радость просто так, без заслуг.", cards: [ { title: "Забыть о радости", desc: "Продолжать только выживать.", effect: -25, log: "Истощение. Жизнь становится серой." }, { title: "Позволить радость", desc: "Найти то, что радует, и дать этому место.", effect: 20, log: "Ресурс. Ты восстанавливаешь энергию." }, { title: "Отложить", desc: "«Вот решу проблемы, тогда порадуюсь».", effect: -15, log: "Жизнь проходит мимо." }, { title: "Планировать", desc: "Выделить время на отдых и хобби.", effect: 15, log: "Структура. Ты заботишься о себе." }, { title: "Сменить фокус", desc: "Обратить внимание на мелочи вокруг.", effect: 10, log: "Присутствие. Ты находишь радость в моменте." } ] },
            { text: "Ты чувствуешь, что твой партнер постоянно критикует твои увлечения. Он говорит, что это пустая трата времени.", inner: "Это обесценивание твоих интересов. Партнер, который любит, уважает твои увлечения, даже если не разделяет их. Это про уважение.", cards: [ { title: "Отказаться от увлечений", desc: "Бросить хобби, чтобы не злить его.", effect: -30, log: "Потеря себя. Ты предаешь свои интересы ради чужого комфорта." }, { title: "Защитить границы", desc: "«Это важно для меня. Не критикуй это».", effect: 20, log: "Границы. Ты показываешь, что с твоими интересами нужно считаться." }, { title: "Спорить", desc: "Доказывать, что твое хобби лучше его.", effect: -10, log: "Скандал. Это бесполезно." }, { title: "Понять его", desc: "«Почему он так реагирует? Может, он завидует?»", effect: 15, log: "Анализ проекций. Это его проблемы, не твои." }, { title: "Уйти", desc: "Подумать, нужен ли тебе такой партнер.", effect: 10, log: "Самосохранение. Это взрослый шаг." } ] },
            { text: "Ты чувствуешь, что постоянно ждешь одобрения от родителей. Даже будучи взрослой, ты хочешь, чтобы они сказали: «Мы тобой гордимся».", inner: "Родители могут не уметь выражать одобрение. Это не значит, что ты недостаточно хороша. Ты можешь стать себе родителем и дать себе это одобрение.", cards: [ { title: "Ждать", desc: "Ждать, что они изменятся.", effect: -25, log: "Разочарование. Это может никогда не случиться." }, { title: "Похвалить себя", desc: "«Я молодец. Я справляюсь».", effect: 20, log: "Внутренняя опора. Ты становишься на свою сторону." }, { title: "Обидеться", desc: "Чувствовать себя ненужной.", effect: -15, log: "Боль. Это не решает проблему." }, { title: "Анализ", desc: "Понять, что их неодобрение — это их ограничения.", effect: 15, log: "Осознание. Ты отделяешь себя от них." }, { title: "Попросить", desc: "Сказать прямо: «Мне важна ваша поддержка».", effect: 10, log: "Диалог. Возможно, они просто не знали." } ] },
            { text: "Ты чувствуешь, что тебя постоянно тянет к токсичным людям. Ты понимаешь, что они делают тебе больно, но не можешь уйти.", inner: "Это травматическая связь. Качели «тепло-холод» вызывают зависимость. Мозг цепляется за редкие моменты тепла, игнорируя боль.", cards: [ { title: "Остаться", desc: "Терпеть боль, надеясь на лучшее.", effect: -30, log: "Разрушение. Ты теряешь себя в этой связи." }, { title: "Уйти", desc: "Признать зависимость и уйти.", effect: 20, log: "Освобождение. Ты выбираешь себя, а не боль." }, { title: "Надеяться", desc: "Верить, что он изменится.", effect: -20, log: "Иллюзия. Он не изменится." }, { title: "Анализ", desc: "Понять, почему тебя тянет к боли (детский опыт).", effect: 15, log: "Осознание. Ты видишь корень проблемы." }, { title: "Попросить помощь", desc: "Обратиться к психологу.", effect: 10, log: "Поддержка. Ты не одна." } ] },
            { text: "Ты чувствуешь, что тебе стыдно за свои эмоции. Ты считаешь, что злиться, плакать или бояться — это плохо.", inner: "Эмоции — это не слабость. Это сигналы. Подавленные эмоции уходят в тело и вызывают болезни. Ты имеешь право чувствовать.", cards: [ { title: "Подавить", desc: "Спрятать эмоции подальше.", effect: -25, log: "Психосоматика. Тело начинает болеть." }, { title: "Принять", desc: "«Я чувствую это. Это нормально».", effect: 20, log: "Свобода. Эмоция теряет свою власть." }, { title: "Ругать себя", desc: "«Нельзя быть такой слабой».", effect: -15, log: "Самоуничтожение." }, { title: "Проговорить", desc: "Назвать эмоцию вслух.", effect: 15, log: "Осознание. Ты берешь ее под контроль." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать контролировать всё вокруг. Ты думаешь, что без тебя всё развалится.", inner: "Это иллюзия контроля. Ты можешь контролировать только свои реакции. Жизнь — это поток, а не проект.", cards: [ { title: "Контролировать", desc: "Пытаться всё предусмотреть.", effect: -25, log: "Тревога. Это истощает." }, { title: "Отпустить", desc: "«Будь что будет».", effect: 20, log: "Свобода. Ты возвращаешь себе энергию." }, { title: "Планировать", desc: "Сделать план, но не привязываться.", effect: 5, log: "Иллюзия контроля." }, { title: "Заземлиться", desc: "Почувствовать момент.", effect: 15, log: "Возврат в реальность." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 10, log: "Смена фокуса." } ] },
            { text: "Ты чувствуешь, что устала быть сильной. Ты хочешь, чтобы кто-то позаботился о тебе, но боишься об этом попросить.", inner: "Сила — это не отсутствие слабости. Это умение признавать ее и просить помощь. Уязвимость — это тоже сила.", cards: [ { title: "Молчать", desc: "Терпеть и быть сильной.", effect: -25, log: "Истощение. Ты разрушаешь себя." }, { title: "Попросить", desc: "Сказать: «Мне нужна помощь».", effect: 20, log: "Свобода. Ты становишься живой." }, { title: "Оправдываться", desc: "Объяснять, почему ты устала.", effect: -10, log: "Ты тратишь энергию зря." }, { title: "Найти поддержку", desc: "Обратиться к близким.", effect: 15, log: "Связь. Ты не одна." }, { title: "Отдохнуть", desc: "Позволить себе паузу.", effect: 10, log: "Восстановление." } ] },
            { text: "Ты чувствуешь, что не можешь простить себя за то, что позволила другим себя использовать. Ты чувствуешь вину и стыд.", inner: "Вина — это не твоя вина. Это опыт. Ты не знала тогда того, что знаешь сейчас. Ты имеешь право на ошибку.", cards: [ { title: "Карать себя", desc: "Ругать себя за слабость.", effect: -25, log: "Самоуничтожение." }, { title: "Простить", desc: "«Я сделала лучшее, что могла. Я учусь».", effect: 20, log: "Освобождение. Ты двигаешься дальше." }, { title: "Оправдывать других", desc: "Искать им оправдание.", effect: -15, log: "Ты снова обесцениваешь себя." }, { title: "Анализ", desc: "Понять, почему это произошло, и какие выводы сделать.", effect: 15, log: "Мудрость." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться, что тебя не выберут. В любой группе или отношениях ты чувствуешь себя лишней.", inner: "Ты не обязана быть выбранной. Ты можешь выбирать сама. Твоя ценность не зависит от того, выбрали тебя или нет.", cards: [ { title: "Угождать", desc: "Стараться всем понравиться.", effect: -25, log: "Потеря себя." }, { title: "Выбрать себя", desc: "«Я выбираю себя. Мне не нужно чужое одобрение».", effect: 20, log: "Свобода. Ты становишься на свою сторону." }, { title: "Замкнуться", desc: "Избегать людей.", effect: -15, log: "Изоляция." }, { title: "Анализ", desc: "Понять, откуда этот страх.", effect: 15, log: "Осознание. Это из детства." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать сравнивать своего партнера с другими. Тебе кажется, что кто-то мог бы быть лучше.", inner: "Сравнение убивает отношения. Ты не знаешь, что происходит за закрытыми дверями у других. Идеальных людей не существует.", cards: [ { title: "Сравнивать", desc: "Искать недостатки в партнере.", effect: -25, log: "Ты разрушаешь отношения." }, { title: "Принять", desc: "«У каждого есть недостатки. Я выбираю этого человека».", effect: 20, log: "Зрелость. Ты принимаешь реальность." }, { title: "Идеализировать других", desc: "Думать, что у всех всё идеально.", effect: -15, log: "Иллюзия." }, { title: "Поговорить", desc: "Обсудить с партнером, что тебя беспокоит.", effect: 15, log: "Диалог. Это шанс на улучшение." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать беспокоиться о том, что о тебе думают другие. Ты постоянно анализируешь их взгляды и слова.", inner: "Люди редко думают о тебе. Они заняты собой. Их мнение — это их проекции, а не факт о тебе.", cards: [ { title: "Анализировать", desc: "Прокручивать их слова в голове.", effect: -25, log: "Тревога. Ты истощаешься." }, { title: "Принять", desc: "«Их мнение — не моя проблема».", effect: 20, log: "Свобода. Ты перестаешь зависеть от чужих оценок." }, { title: "Спросить", desc: "Уточнить, что они имели в виду.", effect: 5, log: "Иногда это помогает, иногда нет." }, { title: "Заземлиться", desc: "Вернуться в настоящий момент.", effect: 15, log: "Возврат в реальность." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 10, log: "Смена фокуса." } ] },
{ text: "Ты чувствуешь, что не можешь перестать искать одобрения у противоположного пола. Твоя самооценка зависит от того, нравишься ли ты мужчинам.", inner: "Это зависимость от внешней оценки. Твоя ценность не определяется тем, хотят ли тебя мужчины. Ты ценна сама по себе.", cards: [ { title: "Искать одобрение", desc: "Стараться понравиться всем мужчинам.", effect: -25, log: "Зависимость. Ты теряешь себя." }, { title: "Опора на себя", desc: "«Я ценна сама по себе».", effect: 20, log: "Свобода. Ты становишься на свою сторону." }, { title: "Обесценить мужчин", desc: "«Они мне все равно не нужны».", effect: -10, log: "Защита. Это не решает проблему." }, { title: "Анализ", desc: "Понять, откуда эта зависимость.", effect: 15, log: "Осознание. Это из детства." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать винить себя за то, что не соответствуешь идеалам красоты.", inner: "Идеалы красоты — это иллюзия, созданная индустрией. Ты не обязана соответствовать чужим стандартам. Ты красива такой, какая ты есть.", cards: [ { title: "Соответствовать", desc: "Пытаться достичь идеала.", effect: -25, log: "Истощение. Это никогда не закончится." }, { title: "Принять себя", desc: "«Я красива такой, какая я есть».", effect: 20, log: "Свобода. Ты перестаешь быть заложником картинки." }, { title: "Игнорировать", desc: "Не думать об этом.", effect: -10, log: "Проблема осталась внутри." }, { title: "Анализ", desc: "Понять, откуда этот идеал.", effect: 15, log: "Осознание. Это навязано обществом." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться, что тебя бросят. В любых отношениях ты ждешь, что тебя оставят.", inner: "Страх быть брошенной — это страх из детства. Ты можешь научиться доверять и строить безопасные отношения.", cards: [ { title: "Цепляться", desc: "Контролировать партнера.", effect: -25, log: "Ты разрушаешь отношения." }, { title: "Доверять", desc: "«Я могу доверять. Я в безопасности».", effect: 20, log: "Свобода. Ты учишься строить близость." }, { title: "Избегать", desc: "Не вступать в отношения.", effect: -15, log: "Изоляция." }, { title: "Анализ", desc: "Понять, откуда этот страх.", effect: 15, log: "Осознание. Это из травмы." }, { title: "Поговорить", desc: "С партнером о своих страхах.", effect: 10, log: "Диалог. Это помогает." } ] },
            { text: "Ты чувствуешь, что не можешь перестать завидовать подругам, у которых есть отношения.", inner: "Зависть — это сигнал о твоих желаниях. Но чужая жизнь — не твоя. Ты не знаешь, что происходит за закрытыми дверями.", cards: [ { title: "Завидовать", desc: "Чувствовать себя хуже.", effect: -25, log: "Токсичное чувство." }, { title: "Сменить фокус", desc: "Сравнивать с собой вчерашней.", effect: 20, log: "Свой темп." }, { title: "Обесценить", desc: "«У них все фейк».", effect: -10, log: "Защита Эго." }, { title: "Анализ", desc: "Понять, чего именно ты хочешь.", effect: 15, log: "Осознание." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 10, log: "Смена фокуса." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться, что тебя осудят за твой выбор в отношениях.", inner: "Твой выбор — только твой. Люди могут осуждать, но жить с этим выбором тебе. Ты имеешь право на свою жизнь.", cards: [ { title: "Бояться", desc: "Прятать свой выбор.", effect: -25, log: "Ты теряешь себя." }, { title: "Принять", desc: "«Это мой выбор. Я так живу».", effect: 20, log: "Свобода." }, { title: "Оправдываться", desc: "Объяснять свой выбор.", effect: -10, log: "Ты тратишь энергию зря." }, { title: "Анализ", desc: "Понять, почему их осуждение так важно.", effect: 15, log: "Осознание." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать сравнивать себя с бывшими партнера. Тебе кажется, что ты хуже или лучше их.", inner: "Сравнение с бывшими — это ловушка. Ты не знаешь их реальности. Твоя ценность не зависит от того, какая ты на фоне других.", cards: [ { title: "Сравнивать", desc: "Постоянно думать о бывших.", effect: -25, log: "Ты застреваешь в прошлом." }, { title: "Принять", desc: "«Я не хуже и не лучше. Я — это я».", effect: 20, log: "Свобода." }, { title: "Обесценить", desc: "«Они все были плохие».", effect: -10, log: "Защита." }, { title: "Анализ", desc: "Понять, откуда это сравнение.", effect: 15, log: "Осознание." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться, что твой партнер найдет кого-то лучше.", inner: "Страх потери — это часть любви. Но если ты живешь в постоянном страхе, ты не живешь. Ты можешь доверять и строить отношения.", cards: [ { title: "Контролировать", desc: "Проверять телефон, следить.", effect: -25, log: "Ты разрушаешь отношения." }, { title: "Доверять", desc: "«Я доверяю и выбираю его».", effect: 20, log: "Свобода." }, { title: "Игнорировать", desc: "Не думать об этом.", effect: -10, log: "Тревога осталась." }, { title: "Анализ", desc: "Понять, откуда этот страх.", effect: 15, log: "Осознание." }, { title: "Поговорить", desc: "С партнером.", effect: 10, log: "Диалог." } ] },
            { text: "Ты чувствуешь, что не можешь перестать осуждать себя за то, что ты не идеальная мать (или жена, или дочь).", inner: "Идеальных матерей не существует. Ты делаешь лучшее, что можешь. Ты имеешь право на ошибку и на усталость.", cards: [ { title: "Ругать себя", desc: "Сравнивать с идеалом.", effect: -25, log: "Самоуничтожение." }, { title: "Принять", desc: "«Я не идеальна, и это нормально».", effect: 20, log: "Свобода." }, { title: "Оправдываться", desc: "Объяснять, почему ты не идеальна.", effect: -10, log: "Ты тратишь энергию зря." }, { title: "Анализ", desc: "Понять, откуда этот идеал.", effect: 15, log: "Осознание." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать думать о том, что было бы, если бы ты выбрала другого партнера.", inner: "Прошлое нельзя изменить. Жизнь с другим партнером — это фантазия, а не реальность. Ты можешь строить свою жизнь здесь и сейчас.", cards: [ { title: "Фантазировать", desc: "Прокручивать альтернативные сценарии.", effect: -25, log: "Ты упускаешь настоящую жизнь." }, { title: "Принять", desc: "«Я живу здесь и сейчас».", effect: 20, log: "Свобода." }, { title: "Обесценить", desc: "«Все партнеры одинаковые».", effect: -10, log: "Защита." }, { title: "Анализ", desc: "Понять, чего тебе не хватает сейчас.", effect: 15, log: "Осознание." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать винить себя за то, что когда-то не защитила себя.", inner: "Вина за то, что не защитила себя — это не твоя вина. Ты не знала тогда того, что знаешь сейчас. Ты имеешь право на ошибку и на прощение.", cards: [ { title: "Карать себя", desc: "Ругать себя за слабость.", effect: -25, log: "Самоуничтожение. Это не помогает." }, { title: "Простить", desc: "«Я сделала лучшее, что могла. Я учусь».", effect: 20, log: "Освобождение. Ты двигаешься дальше." }, { title: "Оправдывать других", desc: "Искать им оправдание.", effect: -15, log: "Ты снова обесцениваешь себя." }, { title: "Анализ", desc: "Понять, почему это произошло, и какие выводы сделать.", effect: 15, log: "Мудрость. Ты превращаешь боль в рост." }, { title: "Заняться делом", desc: "Отвлечься на работу или хобби.", effect: 5, log: "Временное облегчение." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться, что тебя не поймут в твоем выборе.", inner: "Быть понятой — это не обязанность. Ты имеешь право на свой выбор, даже если его не понимают. Ты не обязана быть удобной.", cards: [ { title: "Молчать", desc: "Скрывать свой выбор.", effect: -25, log: "Потеря голоса." }, { title: "Выразить", desc: "Сказать о своем выборе, даже если не поймут.", effect: 20, log: "Свобода. Ты остаешься собой." }, { title: "Оправдываться", desc: "Объяснять, почему ты так решила.", effect: -10, log: "Ты тратишь энергию зря." }, { title: "Найти тех, кто поймет", desc: "Сменить окружение.", effect: 15, log: "Поддержка." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться, что тебя не примут в семье партнера.", inner: "Принятие в семье — это не обязанность. Ты не можешь заставить их принять тебя. Ты можешь принять себя и строить отношения с партнером.", cards: [ { title: "Угождать", desc: "Стараться понравиться всем.", effect: -25, log: "Потеря себя." }, { title: "Принять себя", desc: "«Я принимаю себя. Я не обязана нравиться всем».", effect: 20, log: "Свобода." }, { title: "Обесценить", desc: "«Мне всё равно на них».", effect: -15, log: "Защита." }, { title: "Анализ", desc: "Понять, откуда этот страх.", effect: 15, log: "Осознание." }, { title: "Поговорить", desc: "С партнером.", effect: 10, log: "Поддержка." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться, что ты не справишься с материнством.", inner: "Материнство — это навык. Ты учишься на ходу. Ты имеешь право на ошибку и на помощь. Ты не одна.", cards: [ { title: "Бояться", desc: "Прокручивать худшее.", effect: -25, log: "Паралич." }, { title: "Принять", desc: "«Я учусь. Я справлюсь».", effect: 20, log: "Свобода." }, { title: "Оправдываться", desc: "Объяснять, почему ты боишься.", effect: -10, log: "Ты тратишь энергию зря." }, { title: "Попросить помощь", desc: "Обратиться к близким.", effect: 15, log: "Поддержка. Ты не одна." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться, что ты будешь плохой женой.", inner: "Идеальных жен не существует. Ты делаешь лучшее, что можешь. Ты имеешь право на ошибку и на усталость.", cards: [ { title: "Ругать себя", desc: "Сравнивать с идеалом.", effect: -25, log: "Самоуничтожение." }, { title: "Принять", desc: "«Я не идеальна, и это нормально».", effect: 20, log: "Свобода." }, { title: "Оправдываться", desc: "Объяснять, почему ты не идеальна.", effect: -10, log: "Ты тратишь энергию зря." }, { title: "Анализ", desc: "Понять, откуда этот идеал.", effect: 15, log: "Осознание." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать винить себя за то, что не успеваешь всё.", inner: "Ты не робот. Ты не обязана всё успевать. Ты имеешь право на отдых и на помощь. Ты не одна.", cards: [ { title: "Карать себя", desc: "Ругать себя за медлительность.", effect: -25, log: "Самоуничтожение." }, { title: "Принять", desc: "«Я не всё успеваю, и это нормально».", effect: 20, log: "Свобода." }, { title: "Оправдываться", desc: "Объяснять, почему ты не успеваешь.", effect: -10, log: "Ты тратишь энергию зря." }, { title: "Делегировать", desc: "Попросить помощь.", effect: 15, log: "Поддержка." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться, что тебя не выберут на работе.", inner: "Твоя ценность не определяется тем, выбрали тебя или нет. Ты можешь развиваться и искать новые возможности.", cards: [ { title: "Угождать", desc: "Стараться всем понравиться.", effect: -25, log: "Потеря себя." }, { title: "Принять", desc: "«Я ценна сама по себе».", effect: 20, log: "Свобода." }, { title: "Обесценить", desc: "«Мне всё равно на них».", effect: -10, log: "Защита." }, { title: "Анализ", desc: "Понять, откуда этот страх.", effect: 15, log: "Осознание." }, { title: "Развиваться", desc: "Учиться новому.", effect: 10, log: "Рост." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться, что тебя не повысят.", inner: "Карьера — это путь. Ты можешь развиваться и искать новые возможности. Ты не обязана соответствовать чужим ожиданиям.", cards: [ { title: "Бояться", desc: "Прокручивать худшее.", effect: -25, log: "Паралич." }, { title: "Принять", desc: "«Я делаю лучшее, что могу».", effect: 20, log: "Свобода." }, { title: "Оправдываться", desc: "Объяснять, почему тебя не повышают.", effect: -10, log: "Ты тратишь энергию зря." }, { title: "Поговорить", desc: "С руководством.", effect: 15, log: "Диалог." }, { title: "Искать новое", desc: "Начать искать другую работу.", effect: 10, log: "Действие." } ] },
            { text: "Ты чувствуешь, что не можешь перестать завидовать коллегам, которых повысили.", inner: "Зависть — это сигнал о твоих желаниях. Но чужая карьера — не твоя. Ты не знаешь, какой ценой они это получили.", cards: [ { title: "Завидовать", desc: "Чувствовать себя хуже.", effect: -25, log: "Токсичное чувство." }, { title: "Сменить фокус", desc: "Сравнивать с собой вчерашней.", effect: 20, log: "Свой темп." }, { title: "Обесценить", desc: "«Им просто повезло».", effect: -10, log: "Защита Эго." }, { title: "Анализ", desc: "Понять, чего именно ты хочешь.", effect: 15, log: "Осознание." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 10, log: "Смена фокуса." } ] },
{ text: "Ты чувствуешь, что не можешь перестать думать о том, как ты выглядишь в глазах других. Ты постоянно оцениваешь себя со стороны.", inner: "Ты не можешь контролировать, как тебя видят другие. Ты можешь контролировать только то, как ты видишь себя. Твоя ценность не зависит от чужого взгляда.", cards: [ { title: "Оценивать себя", desc: "Постоянно думать о внешности.", effect: -25, log: "Ты застреваешь в тревоге." }, { title: "Принять", desc: "«Я не могу контролировать их взгляд. Я принимаю себя».", effect: 20, log: "Свобода." }, { title: "Обесценить", desc: "«Мне всё равно на них».", effect: -10, log: "Защита." }, { title: "Анализ", desc: "Понять, откуда этот страх.", effect: 15, log: "Осознание." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать винить себя за то, что не выглядишь как модель с обложки.", inner: "Идеалы красоты — это иллюзия, созданная индустрией. Ты не обязана соответствовать чужим стандартам. Ты красива такой, какая ты есть.", cards: [ { title: "Соответствовать", desc: "Пытаться достичь идеала.", effect: -25, log: "Истощение. Это никогда не закончится." }, { title: "Принять себя", desc: "«Я красива такой, какая я есть».", effect: 20, log: "Свобода. Ты перестаешь быть заложником картинки." }, { title: "Игнорировать", desc: "Не думать об этом.", effect: -10, log: "Проблема осталась внутри." }, { title: "Анализ", desc: "Понять, откуда этот идеал.", effect: 15, log: "Осознание. Это навязано обществом." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться, что тебя не выберут на фотосессии или кастинге.", inner: "Твоя ценность не определяется тем, выбрали тебя или нет. Ты можешь развиваться и искать новые возможности.", cards: [ { title: "Угождать", desc: "Стараться всем понравиться.", effect: -25, log: "Потеря себя." }, { title: "Принять", desc: "«Я ценна сама по себе».", effect: 20, log: "Свобода." }, { title: "Обесценить", desc: "«Мне всё равно на них».", effect: -10, log: "Защита." }, { title: "Анализ", desc: "Понять, откуда этот страх.", effect: 15, log: "Осознание." }, { title: "Развиваться", desc: "Учиться новому.", effect: 10, log: "Рост." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться, что тебя не пригласят на свидание.", inner: "Ты не обязана быть выбранной. Ты можешь выбирать сама. Твоя ценность не зависит от того, пригласили тебя или нет.", cards: [ { title: "Угождать", desc: "Стараться всем понравиться.", effect: -25, log: "Потеря себя." }, { title: "Выбрать себя", desc: "«Я выбираю себя. Мне не нужно чужое одобрение».", effect: 20, log: "Свобода. Ты становишься на свою сторону." }, { title: "Замкнуться", desc: "Избегать людей.", effect: -15, log: "Изоляция." }, { title: "Анализ", desc: "Понять, откуда этот страх.", effect: 15, log: "Осознание. Это из детства." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться, что тебя не полюбят.", inner: "Любовь начинается с тебя. Ты можешь любить себя сама. Ты не обязана быть любимой всеми.", cards: [ { title: "Искать любовь", desc: "Добиваться любви любой ценой.", effect: -25, log: "Зависимость. Ты теряешь себя." }, { title: "Принять себя", desc: "«Я люблю себя. Я не обязана быть любимой всеми».", effect: 20, log: "Свобода." }, { title: "Обесценить", desc: "«Мне всё равно на них».", effect: -10, log: "Защита." }, { title: "Анализ", desc: "Понять, откуда этот страх.", effect: 15, log: "Осознание." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться, что тебя не оценят по достоинству.", inner: "Твоя ценность не зависит от того, оценили тебя или нет. Ты ценна сама по себе.", cards: [ { title: "Бояться", desc: "Прокручивать худшее.", effect: -25, log: "Паралич." }, { title: "Принять", desc: "«Я ценна сама по себе».", effect: 20, log: "Свобода." }, { title: "Оправдываться", desc: "Объяснять, почему тебя не оценили.", effect: -10, log: "Ты тратишь энергию зря." }, { title: "Анализ", desc: "Понять, откуда этот страх.", effect: 15, log: "Осознание." }, { title: "Развиваться", desc: "Учиться новому.", effect: 10, log: "Рост." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться, что тебя не выберут в друзья.", inner: "Дружба — это не выбор. Это процесс. Ты не обязана быть выбранной. Ты можешь выбирать сама.", cards: [ { title: "Угождать", desc: "Стараться всем понравиться.", effect: -25, log: "Потеря себя." }, { title: "Выбрать себя", desc: "«Я выбираю себя. Мне не нужно чужое одобрение».", effect: 20, log: "Свобода." }, { title: "Замкнуться", desc: "Избегать людей.", effect: -15, log: "Изоляция." }, { title: "Анализ", desc: "Понять, откуда этот страх.", effect: 15, log: "Осознание." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },
            { text: "Ты чувствуешь, что не можешь перестать бояться, что тебя не позовут на вечеринку.", inner: "Ты не обязана быть везде. Ты можешь выбирать, куда идти. Твоя ценность не зависит от того, позвали тебя или нет.", cards: [ { title: "Бояться", desc: "Прокручивать худшее.", effect: -25, log: "Паралич." }, { title: "Принять", desc: "«Я ценна сама по себе».", effect: 20, log: "Свобода." }, { title: "Оправдываться", desc: "Объяснять, почему тебя не позвали.", effect: -10, log: "Ты тратишь энергию зря." }, { title: "Анализ", desc: "Понять, откуда этот страх.", effect: 15, log: "Осознание." }, { title: "Отвлечься", desc: "Заняться делом.", effect: 5, log: "Временное." } ] },

        // --- ЛОГИКА ИГРЫ ---
        let ego = 100;
        let currentIndex = 0;
        let isShadowActive = false;
        let currentScenarios = [];

        // Получаем элементы со страницы
        const npcText = document.getElementById('npc-text');
        const innerMonologue = document.getElementById('inner-monologue');
        const cardsContainer = document.getElementById('cards-container');
        const egoBar = document.getElementById('ego-bar');
        const shadowOverlay = document.getElementById('shadow-overlay');
        const gameOverScreen = document.getElementById('game-over');
        const testOptions = document.getElementById('test-options');

        // Функция для перемешивания карточек и ситуаций
        function shuffle(a) {
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // Обновление шкалы Эго
        function updateEgo(amount) {
            ego = Math.max(0, Math.min(100, ego + amount));
            egoBar.style.width = `${ego}%`;
            
            // Меняем цвет в зависимости от состояния
            if (ego > 60) {
                egoBar.style.backgroundColor = 'var(--green)';
                egoBar.style.boxShadow = '0 0 10px var(--green)';
            } else if (ego > 30) {
                egoBar.style.backgroundColor = 'var(--yellow)';
                egoBar.style.boxShadow = '0 0 10px var(--yellow)';
            } else {
                egoBar.style.backgroundColor = 'var(--red)';
                egoBar.style.boxShadow = '0 0 10px var(--red)';
            }

            // Включаем "Тень", если Эго падает ниже 30
            if (ego <= 30 && !isShadowActive) {
                triggerShadowEvent();
            }

            // Проигрыш
            if (ego <= 0) {
                endGame(false);
            }
        }

        // Эффект получения урона (вспышка)
        function flashDamage() {
            document.body.classList.add('damage-flash');
            setTimeout(() => document.body.classList.remove('damage-flash'), 500);
        }

        // Событие "Тень" (Тест на самоидентификацию)
        function triggerShadowEvent() {
            isShadowActive = true;
            shadowOverlay.classList.add('active');
            
            const options = [
                { text: "«Я слабая, они правы. Я не справляюсь».", correct: false },
                { text: "«Я вижу их проекции. Ко мне это не относится. Я — та, кто видит реальность».", correct: true },
                { text: "«Мне нужно им доказать, что я лучше».", correct: false }
            ];

            testOptions.innerHTML = '';
            options.sort(() => Math.random() - 0.5);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'test-btn';
                btn.innerText = opt.text;
                btn.onclick = () => {
                    if (opt.correct) {
                        btn.classList.add('correct');
                        ego = 50; // Восстанавливаем здоровье
                        updateEgo(0);
                        shadowOverlay.classList.remove('active');
                        isShadowActive = false;
                    } else {
                        btn.classList.add('wrong');
                        setTimeout(() => {
                            ego -= 20;
                            updateEgo(0);
                            if (ego <= 0) shadowOverlay.classList.remove('active');
                            else triggerShadowEvent(); // Повторяем тест, если не угадал
                        }, 500);
                    }
                };
                testOptions.appendChild(btn);
            });
        }

        // Отрисовка ситуации на экране
        function renderScenario() {
            if (currentIndex >= currentScenarios.length) {
                endGame(true); // Победа
                return;
            }

            const scenario = currentScenarios[currentIndex];
            npcText.innerText = scenario.text;
            innerMonologue.innerText = scenario.inner;
            cardsContainer.innerHTML = '';

            // Перемешиваем карточки с ответами
            const shuffledCards = shuffle([...scenario.cards]);

            shuffledCards.forEach(cardData => {
                const card = document.createElement('div');
                card.className = 'card';
                
                card.innerHTML = `<div class="card-title">${cardData.title}</div><div class="card-desc">${cardData.desc}</div>`;
                
                card.onclick = () => {
                    updateEgo(cardData.effect);
                    if (cardData.effect < 0) flashDamage();

                    // Показываем результат выбора
                    npcText.innerHTML = `<span style="color: ${cardData.effect < 0 ? 'var(--red)' : 'var(--green)'}; font-size: 1rem;">${cardData.log}</span>`;
                    innerMonologue.innerText = "";
                    cardsContainer.innerHTML = '';

                    window.scrollTo({ top: 0, behavior: 'smooth' });

                    // Задержка перед следующим ходом
                    setTimeout(() => {
                        if (ego > 0 && !isShadowActive) {
                            currentIndex++;
                            renderScenario();
                        }
                    }, 3000);
                };
                cardsContainer.appendChild(card);
            });
        }

        // Экран конца игры
        function endGame(isWin) {
            gameOverScreen.classList.add('active');
            const title = document.getElementById('final-title');
            const desc = document.getElementById('final-desc');

            if (isWin) {
                title.innerText = "Желтый уровень";
                title.style.color = "var(--green)";
                desc.innerText = "Ты прошла сквозь их проекции. Ты видишь реальность. Ты — оригинал, они — копии. Ты больше никогда не пересечетесь. Это твой путь к свободе.";
            } else {
                title.innerText = "Серая яма";
                title.style.color = "var(--red)";
                desc.innerText = "Ты приняла их проекции за чистую монету. Ты позволила им определить, кто ты. Твое «Я» растворилось в чужом мнении. Это застой вниз.";
            }
        }

        // Перезапуск игры
        function resetGame() {
            ego = 100;
            currentIndex = 0;
            isShadowActive = false;
            gameOverScreen.classList.remove('active');
            shadowOverlay.classList.remove('active');
            
            // Выбираем 10 случайных ситуаций из всей базы
            currentScenarios = shuffle([...db]).slice(0, 10);
            
            updateEgo(0);
            renderScenario();
        }

        // Запуск при загрузке страницы
        window.onload = () => {
            // Берем 10 случайных ситуаций для одной партии
            currentScenarios = shuffle([...db]).slice(0, 10);
            updateEgo(0);
            renderScenario();
        };
